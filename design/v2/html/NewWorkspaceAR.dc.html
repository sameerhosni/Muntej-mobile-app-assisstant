<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { inc: { n: true, s: true, m: true, f: false }, created: false };
  }
  renderVals() {
    const ppl = [
      { id: 'n', initial: 'ن', name: 'نورة', role: 'تصميم', why: 'صممت نقاط Availo · فاضية 12 ساعة', match: 94 },
      { id: 's', initial: 'س', name: 'سعد', role: 'جوال', why: 'Flutter · آخر 3 مهام قبل وقتها', match: 88 },
      { id: 'm', initial: 'م', name: 'مها', role: 'تسويق', why: 'أطلقت حملة نظامي', match: 81 },
      { id: 'f', initial: 'ف', name: 'فيصل', role: 'مبيعات', why: 'مضغوط · 115%', match: 62 }
    ];
    const inc = this.state.inc;
    const count = ppl.filter((p) => inc[p.id]).length;
    return {
      count: count,
      open: !this.state.created,
      created: this.state.created,
      create: () => this.setState({ created: true }),
      people: ppl.map((p) => {
        const on = !!inc[p.id];
        return Object.assign({}, p, {
          match: p.match + '%',
          matchColor: p.match >= 80 ? '#16A37A' : '#E8900C',
          pressed: on ? 'true' : 'false',
          bg: on ? '#FFFFFF' : '#F8FAFD',
          border: on ? '1.5px solid #1F6FEB' : '1.5px dashed #D6E2F5',
          opacity: on ? '1' : '0.6',
          toggle: () => this.setState({ inc: Object.assign({}, inc, { [p.id]: !on }) })
        });
      })
    };
  }
}
</script>
