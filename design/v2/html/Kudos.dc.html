    <header style="position: relative; padding: 6px 22px 0; display: flex; align-items: center; gap: 12px">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>

      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600; line-height: 1.2">Kudos</span>
        <span style="font-size: 13px; color: rgba(255,255,255,0.78); display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>5 seconds · no forms</span>
      </div>

  </section>

  <section style="position: absolute; left: 22px; right: 22px; top: 122px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(11,42,91,0.10); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div role="radiogroup" aria-label="Who" style="display: flex; justify-content: space-between">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{p.sel}}" onClick="{{p.pick}}" style="width: 56px; display: flex; flex-direction: column; align-items: center; gap: 5px; background: transparent; border: none; padding: 0; color: {{p.color}}; font-family: Karla, sans-serif; font-size: 12px; font-weight: {{p.weight}}">
          <span style="width: 48px; height: 48px; border-radius: 50%; background: {{p.tint}}; border: 2px solid #FFFFFF; box-shadow: 0 0 0 2.5px {{p.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #FFFFFF">{{p.initial}}</span>
          {{p.name}}
        </button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: nowrap">
      <sc-for list="{{values}}" as="v" hint-placeholder-count="4">
        <button type="button" onClick="{{v.pick}}" style="height: 34px; padding: 0 10px; border-radius: 999px; border: {{v.border}}; background: {{v.bg}}; color: {{v.color}}; font-family: Karla, sans-serif; font-size: 12px; font-weight: 700; white-space: nowrap; flex: 1 1 auto">{{v.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 6px; align-items: center">
      <span style="font-size: 12px; font-weight: 600; color: #66728A; margin-right: 4px">Points</span>
      <sc-for list="{{amounts}}" as="a" hint-placeholder-count="3">
        <button type="button" onClick="{{a.pick}}" style="height: 34px; padding: 0 12px 0 6px; border-radius: 999px; border: {{a.border}}; background: {{a.bg}}; color: {{a.color}}; font-family: Karla, sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 5px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); color: #FFFFFF; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">#</span>+{{a.n}}</button>
      </sc-for>
    </div>
    <div style="background: #F3F0FF; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #6D4AFF; font-weight: 700">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#6D4AFF" aria-hidden="true"><path d="M12 3l2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5z"/></svg>
        Drafted from their work
      </span>
      <span style="font-size: 13px; line-height: 1.55; color: #3B475E">{{draft}}</span>
    </div>
    <button type="button" onClick="{{send}}" style="height: 50px; border-radius: 999px; border: none; background: linear-gradient(135deg, #1F6FEB, #2E9BF0); color: #FFFFFF; font-family: Karla, sans-serif; font-size: 16px; font-weight: 700; box-shadow: 0 8px 20px rgba(31,111,235,0.30)">Send kudos +{{amount}}</button>
  </section>

  <section style="position: absolute; left: 22px; right: 22px; top: 478px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600">Team wall</span>
    <sc-for list="{{feed}}" as="f" hint-placeholder-count="3">
      <div style="background: #FFFFFF; box-shadow: 0 4px 18px rgba(11,42,91,0.07); border-radius: 18px; padding: 10px 12px; display: flex; gap: 10px; align-items: center">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #FFF1E8; color: #F26A1B; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 2 2v4h5.5a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.3 20H7"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 13px"><b>{{f.from}}</b> → <b>{{f.to}}</b> · <span style="color: #6D4AFF; font-weight: 700">{{f.value}}</span></span>
          <span style="font-size: 12px; color: #66728A; line-height: 1.45">{{f.msg}}</span>
        </span>
        <span style="font-family: Karla, sans-serif; font-size: 13px; font-weight: 800; color: #E2580B; background: #FFF1E8; height: 26px; width: 60px; box-sizing: border-box; padding: 0 9px 0 4px; border-radius: 999px; display: flex; align-items: center; gap: 4px; flex: none"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); color: #FFFFFF; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">#</span>+{{f.pts}}</span>
      </div>
    </sc-for>
  </section>
  <section aria-label="Value" style="position: absolute; left: 22px; right: 22px; top: 722px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 18px rgba(11,42,91,0.07); min-width: 0">
      <span style="width: 30px; height: 30px; border-radius: 10px; background: #E8F0FE; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F6FEB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 800; white-space: nowrap">5 sec</span><span style="font-size: 11px; color: #66728A; white-space: nowrap">per kudos</span></span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 18px rgba(11,42,91,0.07); min-width: 0">
      <span style="width: 30px; height: 30px; border-radius: 10px; background: #E3F7EF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16A37A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/></svg></span>
      <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 800; white-space: nowrap">SAR {{amountSar}}</span><span style="font-size: 11px; color: #66728A; white-space: nowrap">real reward</span></span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 18px rgba(11,42,91,0.07); min-width: 0">
      <span style="width: 30px; height: 30px; border-radius: 10px; background: #FFF1E8; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F26A1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-7a1.5 1.5 0 0 1 3 0V12M14 11.5V6.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.3 15a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg></span>
      <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 800; white-space: nowrap">0</span><span style="font-size: 11px; color: #66728A; white-space: nowrap">forms</span></span>
    </div>
  </section>
  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 7px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #0B1A33; opacity: 0.85"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: 'k', val: 'Ownership', amt: 25, sent: [] };
  }
  renderVals() {
    const P = [
      { id: 'k', name: 'Khalid', initial: 'K', tint: 'linear-gradient(135deg, #0EA5A4, #34D399)', draft: 'Khalid, 6 tasks closed and the sync fixed unasked. Real ownership!' },
      { id: 'n', name: 'Noura', initial: 'N', tint: 'linear-gradient(135deg, #EC4899, #F59E0B)', draft: 'Noura, agent screens landed early and saved a day. Brilliant!' },
      { id: 's', name: 'Saad', initial: 'S', tint: 'linear-gradient(135deg, #F26A1B, #FFB547)', draft: 'Saad, the note taker beta shipped smooth and on time. Great!' },
      { id: 'm', name: 'Maha', initial: 'M', tint: 'linear-gradient(135deg, #16A37A, #84CC16)', draft: 'Maha, our first paying Nizamy customer. Proud of you!' },
      { id: 'f', name: 'Faisal', initial: 'F', tint: 'linear-gradient(135deg, #1F6FEB, #2EC4D6)', draft: 'Faisal, the SPL pitch was sharp and early. Thank you!' }
    ];
    const st = this.state;
    const sel = P.find((p) => p.id === st.who);
    const base = [
      { from: 'Ahmed', to: 'Noura', value: 'Quality', msg: 'Agent screens were spot on.', pts: 50 },
      { from: 'Saad', to: 'Faisal', value: 'Teamwork', msg: 'Covered the client call!', pts: 10 },
      { from: 'Ahmed', to: 'Maha', value: 'Ownership', msg: 'First paying customer!', pts: 50 }
    ];
    const feed = st.sent.concat(base).slice(0, 3);
    return {
      amount: st.amt,
      amountSar: (st.amt / 10).toFixed(st.amt % 10 ? 1 : 0),
      draft: sel.draft,
      people: P.map((p) => ({
        name: p.name, initial: p.initial, tint: p.tint, sel: p.id === st.who ? 'true' : 'false',
        ring: p.id === st.who ? '#1F6FEB' : '#FFFFFF', color: p.id === st.who ? '#0B1A33' : '#66728A',
        weight: p.id === st.who ? '700' : '500',
        pick: () => this.setState({ who: p.id })
      })),
      values: ['Ownership', 'Speed', 'Quality', 'Teamwork'].map((v) => ({
        label: v, border: v === st.val ? '1px solid #1F6FEB' : '1px solid #E6EBF3',
        bg: v === st.val ? '#1F6FEB' : '#FFFFFF', color: v === st.val ? '#FFFFFF' : '#0B1A33',
        pick: () => this.setState({ val: v })
      })),
      amounts: [10, 25, 50].map((n) => ({
        n: n, border: n === st.amt ? '1.5px solid #F26A1B' : '1px solid #E6EBF3',
        bg: n === st.amt ? '#FFF1E8' : '#FFFFFF', color: n === st.amt ? '#E2580B' : '#0B1A33',
        pick: () => this.setState({ amt: n })
      })),
      feed: feed,
      send: () => this.setState({ sent: [{ from: 'Ahmed', to: sel.name, value: st.val, msg: 'Just now · ' + sel.draft.split('.')[0] + '.', pts: st.amt }].concat(st.sent) })
    };
  }
}
</script>
