<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Muntej Setup Quest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FB}
a{color:#1F6FEB;text-decoration:none}a:hover{color:#1557C0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F6FB; color: #0B1A33; font-family: Karla, sans-serif; box-sizing: border-box">

  <section style="position: relative; height: 228px; background: linear-gradient(150deg, #0B2A5B 0%, #1F6FEB 62%, #2EC4D6 120%); border-radius: 0 0 28px 28px; color: #FFFFFF; overflow: hidden">
    <svg aria-hidden="true" width="150" height="150" viewBox="0 0 150 150" style="position: absolute; right: -20px; top: 40px; opacity: 0.16"><g fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M0 40l25-25 25 25 25-25 25 25 25-25 25 25"/><path d="M0 70l25-25 25 25 25-25 25 25 25-25 25 25"/><path d="M0 100l25-25 25 25 25-25 25 25 25-25 25 25"/><path d="M12 128h126" stroke-dasharray="6 8"/></g></svg>
    <span aria-hidden="true" style="position: absolute; left: -60px; bottom: -110px; width: 220px; height: 220px; border-radius: 50%; background: rgba(46,196,214,0.22)"></span>
    <div aria-hidden="true" style="height: 44px; padding: 0 26px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; color: #FFFFFF; position: relative"><span>9:41</span><span style="display: flex; gap: 6px; align-items: center"><svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="currentColor"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="currentColor"/></svg><svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.2c2.2 0 4.2.9 5.7 2.3l1.1-1.1A9.6 9.6 0 0 0 7.5.6 9.6 9.6 0 0 0 .7 3.4l1.1 1.1a8 8 0 0 1 5.7-2.3zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1a6.4 6.4 0 0 0-9 0l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.2c.5 0 .9.2 1.2.5L7.5 10.3 6.3 9.1c.3-.3.7-.5 1.2-.5z" fill="currentColor"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg></span></div>
    <header style="position: relative; padding: 6px 22px 0; display: flex; flex-direction: column; gap: 5px">
      <span style="font-size: 13px; color: rgba(255,255,255,0.78)">Welcome, Ahmed</span>
      <span style="font-family: 'Playfair Display', serif; font-size: 27px; font-weight: 600; line-height: 1.15">Let's go live</span>
    </header>
    <div style="position: relative; margin: 14px 22px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24); border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 8px; background: #2E9BF0; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">5 min</span></span>
        <span style="font-size: 11px; color: rgba(255,255,255,0.85)">to go live</span>
      </div>
      <div style="background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24); border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 8px; background: #F26A1B; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-7a1.5 1.5 0 0 1 3 0V12M14 11.5V6.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.3 15a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">0</span></span>
        <span style="font-size: 11px; color: rgba(255,255,255,0.85)">training hours</span>
      </div>
      <div style="background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24); border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 8px; background: #16A37A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">0</span></span>
        <span style="font-size: 11px; color: rgba(255,255,255,0.85)">SAR setup</span>
      </div>
    </div>
  </section>

  <section style="position: relative; margin: -30px 22px 0; background: #FFFFFF; border-radius: 20px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 24px rgba(11,42,91,0.10)">
    <div style="position: relative; width: 64px; height: 64px; flex: none">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="sqRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F6FEB"/><stop offset="1" stop-color="#2EC4D6"/></linearGradient></defs>
        <circle cx="32" cy="32" r="27" fill="none" stroke="#E9EEF6" stroke-width="7"/>
        <circle cx="32" cy="32" r="27" fill="none" stroke="url(#sqRing)" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{ring}}" transform="rotate(-90 32 32)"/>
      </svg>
      <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #0B2A5B">{{doneN}}/5</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 5px">
      <span style="font-size: 16px; font-weight: 800">{{statusLine}}</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #E2580B; white-space: nowrap"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); color: #FFFFFF; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 3px 8px rgba(242,106,27,0.30)">#</span>{{earned}} / 500 team pts</span>
    </div>
  </section>

  <section style="margin: 16px 22px 0; display: flex; flex-direction: column">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
      <div style="display: flex; gap: 12px">
        <div style="display: flex; flex-direction: column; align-items: center; width: 32px; flex: none">
          <span style="width: 32px; height: 32px; border-radius: 50%; background: {{s.dotBg}}; border: 2px solid {{s.dotBorder}}; color: {{s.dotColor}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; margin-top: 13px">{{s.mark}}</span>
          <span style="width: 2px; flex: 1; min-height: 12px; background: {{s.line}}; border-radius: 1px"></span>
        </div>
        <div style="flex: 1; padding-bottom: 7px">
          <button type="button" onClick="{{s.toggle}}" aria-pressed="{{s.pressed}}" style="width: 100%; background: {{s.cardBg}}; border: 1px solid {{s.cardBorder}}; border-radius: 16px; padding: 9px 10px; display: flex; align-items: center; gap: 10px; font-family: Karla, sans-serif; color: #0B1A33; text-align: left; box-shadow: 0 3px 12px rgba(11,42,91,0.05)">
            <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 11px; background: {{s.tint}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{s.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"/></svg></span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 15px; font-weight: 700; text-decoration: {{s.strike}}">{{s.title}}</span>
              <span style="font-size: 12px; color: #66728A">{{s.sub}}</span>
            </span>
            <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: #E2580B; background: #FFF1E8; padding: 3px 8px 3px 3px; border-radius: 999px; flex: none"><span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); color: #FFFFFF; font-size: 9px; display: flex; align-items: center; justify-content: center">#</span>+{{s.pts}}</span>
          </button>
        </div>
      </div>
    </sc-for>
  </section>

  <div style="position: absolute; left: 22px; right: 22px; bottom: 26px; display: flex; flex-direction: column; gap: 4px">
    <a href="{{ctaHref}}" style="height: 52px; border-radius: 999px; background: linear-gradient(135deg, #1F6FEB, #2E9BF0); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(31,111,235,0.30)">{{cta}}</a>
    <a href="HowTo.dc.html" style="height: 30px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">Stuck? Ask Muntej</a>
  </div>

  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 7px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #0B1A33; opacity: 0.85"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { a: true, b: true } };
  }
  renderVals() {
    const S = [
      { id: 'a', title: 'Say your first task', sub: 'Sent to Faisal', pts: 100, tint: '#E8F0FE', ink: '#1F6FEB', icon: 'M9 3h6v11H9zM5 11a7 7 0 0 0 14 0M12 18v3' },
      { id: 'b', title: 'Add your team', sub: '1 min · no typing', pts: 100, tint: '#EFEBFF', ink: '#6D4AFF', icon: 'M17 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M10 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-1a4 4 0 0 0-3-3.9M16 4.2a3.5 3.5 0 0 1 0 6.6' },
      { id: 'c', title: 'Connect WhatsApp', sub: 'Follow-ups go there', pts: 100, tint: '#E3F7EF', ink: '#16A37A', icon: 'M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5.2A8.5 8.5 0 1 1 21 11.5z' },
      { id: 'd', title: 'Set quiet hours', sub: 'Prayer times pre-set', pts: 100, tint: '#FFF4E0', ink: '#E8900C', icon: 'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z' },
      { id: 'e', title: 'First decision', sub: 'Arrives today', pts: 100, tint: '#FFF1E8', ink: '#F26A1B', icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM8 12l3 3 5-6' }
    ];
    const d = this.state.done;
    const n = S.filter((s) => d[s.id]).length;
    const nextIdx = S.findIndex((s) => !d[s.id]);
    const circ = 2 * Math.PI * 27;
    return {
      doneN: n,
      earned: n * 100,
      ring: (circ * n / 5).toFixed(1) + ' ' + circ.toFixed(1),
      statusLine: n === 5 ? 'All set · Muntej is on' : (5 - n) + ' steps left',
      cta: n === 5 ? 'Go to my home' : 'Next: ' + S[nextIdx].title,
      ctaHref: n === 5 ? 'Main.dc.html' : (S[nextIdx].id === 'b' ? 'AddTeam.dc.html' : (S[nextIdx].id === 'c' ? 'Sources.dc.html' : (S[nextIdx].id === 'd' ? 'Alerts.dc.html' : 'Decisions.dc.html'))),
      steps: S.map((s, i) => {
        const on = !!d[s.id];
        const isNext = i === nextIdx;
        return Object.assign({}, s, {
          pressed: on ? 'true' : 'false',
          mark: on ? '✓' : String(i + 1),
          dotBg: on ? 'linear-gradient(135deg, #1F6FEB, #2EC4D6)' : (isNext ? '#E8F0FE' : '#FFFFFF'), dotBorder: on ? '#FFFFFF' : (isNext ? '#1F6FEB' : '#D6DEEA'), dotColor: on ? '#FFFFFF' : (isNext ? '#1F6FEB' : '#97A1B5'),
          line: i === S.length - 1 ? 'transparent' : (on ? '#1F6FEB' : '#DDE4EF'),
          cardBg: isNext ? '#E8F0FE' : '#FFFFFF', cardBorder: isNext ? '#B9D0F7' : '#FFFFFF',
          strike: on ? 'none' : 'none',
          toggle: () => this.setState({ done: Object.assign({}, d, { [s.id]: !on }) })
        });
      })
    };
  }
}
</script>
</body>
</html>
