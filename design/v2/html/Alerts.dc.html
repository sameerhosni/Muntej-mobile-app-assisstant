        <span style="font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{c.color}}"></span>{{c.state}}</span>

          <svg class="ri r6" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ri r7" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column">

          <span style="font-size: 11px; color: #66728A">{{r.via}}</span>

  <section style="margin: 10px 22px 0; background: #FFFFFF; border-radius: 18px; padding: 0 14px; display: flex; flex-direction: column; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">

      </span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Quiet hours</span><span style="font-size: 11px; color: #66728A">Prayer · after 9 PM · Fri · Ramadan</span></span>

        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </span>
      <span style="flex: 1; font-size: 14px; font-weight: 700; white-space: nowrap">Escalate</span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #8A5A00">

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E8900C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        <span style="background: #FFF4E0; padding: 3px 7px; border-radius: 999px">2 nudges</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E8900C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>

  <section style="margin: 10px 22px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">

        <span style="display: flex; align-items: center; gap: 7px"><span style="width: 28px; height: 28px; border-radius: 9px; background: #E8F0FE; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F6FEB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/><path d="M4 4l16 16"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">4/day</span></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      ch: { push: true, mail: true, wa: true, tm: false },
      ru: { risk: true, late: true, approve: true, review: true, daily: true, weekly: false, kudos: true }
    };
  }
  renderVals() {
    const st = this.state;
    const chs = [['push', 'Push'], ['mail', 'Email'], ['wa', 'WhatsApp'], ['tm', 'Teams']];
    const rules = [
      ['risk', 'At risk', 'Push + WhatsApp · now', '#E5484D'],
      ['late', 'Overdue', 'Push · now', '#E5484D'],
      ['approve', 'Needs your decision', 'Push · now', '#E8900C'],
      ['review', 'New to review', 'Push', '#E8900C'],
      ['kudos', 'Kudos & rewards', 'Push · now', '#F26A1B'],
      ['daily', 'Daily digest', 'Email · 8 AM', '#1F6FEB'],
      ['weekly', 'Weekly report', 'Email · Thu 4 PM', '#6D4AFF']
    ];
    const sw = (on) => ({ pressed: on ? 'true' : 'false', track: on ? '#1F6FEB' : '#D6DEEA', justify: on ? 'flex-end' : 'flex-start' });
    return {
      channels: chs.map((c) => {
        const on = !!st.ch[c[0]];
        return { name: c[1], pressed: on ? 'true' : 'false', state: on ? 'On' : 'Off',
          border: on ? '1.5px solid #1F6FEB' : '1.5px dashed #D6E2F5', color: on ? '#1F6FEB' : '#97A1B5',
          bg: on ? '#FFFFFF' : '#F8FAFD',
          toggle: () => this.setState({ ch: Object.assign({}, st.ch, { [c[0]]: !on }) }) };
      }),
      rules: rules.map((r) => {
        const on = !!st.ru[r[0]];
        return Object.assign({ name: r[1], via: r[2], dot: r[3],
          toggle: () => this.setState({ ru: Object.assign({}, st.ru, { [r[0]]: !on }) }) }, sw(on));
      })
    };
  }
}
</script>
