        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.18); padding: 4px 9px 4px 4px; border-radius: 999px"><span style="width: 20px; height: 20px; border-radius: 6px; background: #2E9BF0; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>~25 h on-time work</span>

  <section style="position: absolute; left: 22px; right: 22px; top: 230px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(11,42,91,0.10); border-radius: 20px; padding: 4px 14px; display: flex; flex-direction: column">
    <sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
      <div style="height: 52px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid {{r.divider}}">
        <span style="width: 36px; height: 36px; border-radius: 11px; background: {{r.bg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{r.col}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg></span>
        <span style="flex: 1; font-size: 14px; font-weight: 600">{{r.name}}</span>
        <span style="font-family: Karla, sans-serif; font-size: 13px; font-weight: 800; color: #E2580B; background: #FFF1E8; height: 26px; width: 62px; padding: 0 9px 0 4px; box-sizing: border-box; border-radius: 999px; display: flex; align-items: center; gap: 5px; flex: none"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); color: #FFFFFF; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">#</span>+{{r.pts}}</span>
        <button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.pressed}}" aria-label="{{r.name}}" style="width: 48px; height: 28px; border-radius: 14px; border: none; background: {{r.track}}; padding: 3px; display: flex; justify-content: {{r.justify}}; flex: none">
          <span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(11,42,91,0.25)"></span>
        </button>
      </div>
    </sc-for>
  </section>

  <section style="position: absolute; left: 22px; right: 22px; top: 520px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600">Reward requests</span>
    <sc-for list="{{reqs}}" as="q" hint-placeholder-count="2">
      <div style="background: #FFFFFF; box-shadow: 0 4px 18px rgba(11,42,91,0.07); border-radius: 18px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
        <span style="width: 40px; height: 40px; border-radius: 50%; background: {{q.tint}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: none">{{q.initial}}</span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{q.what}}</span><span style="font-size: 12px; color: #66728A; display: flex; align-items: center; gap: 4px">{{q.who}} · <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); display: inline-block"></span><span style="color: #E2580B; font-weight: 700">{{q.cost}}</span> · <span style="color: #16A37A; font-weight: 700">{{q.sar}}</span></span></span>
        <sc-if value="{{q.open}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{q.approve}}" style="height: 38px; padding: 0 16px; border-radius: 999px; border: none; background: linear-gradient(135deg, #1F6FEB, #2E9BF0); color: #FFFFFF; font-family: Karla, sans-serif; font-size: 13px; font-weight: 700; box-shadow: 0 6px 14px rgba(31,111,235,0.28)">Approve</button>
        </sc-if>
        <sc-if value="{{q.done}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 12px; font-weight: 700; color: #16A37A; background: #E3F7EF; padding: 6px 10px; border-radius: 999px">Approved ✓</span>

      </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { off: { help: false }, ok: {} };
  }
  renderVals() {
    const rules = [
      { id: 'ontime', name: 'On time', pts: 50, bg: '#E8F0FE', col: '#1F6FEB', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2' },
      { id: 'early', name: 'Early bonus', pts: 20, bg: '#EFEBFF', col: '#6D4AFF', icon: 'M13 3L5 14h6l-1 7 8-11h-6z' },
      { id: 'proof', name: 'Proof attached', pts: 15, bg: '#E3F7EF', col: '#16A37A', icon: 'M20 12l-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7' },
      { id: 'star', name: '5-star review', pts: 30, bg: '#FFF4E0', col: '#E8900C', icon: 'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z' },
      { id: 'help', name: 'Helped teammate', pts: 25, bg: '#FDECEC', col: '#E5484D', icon: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z' }
    ];
    const reqs = [
      { id: 'a', initial: 'N', who: 'Noura', what: 'Leave 1 h early', cost: '800 pts', sar: '≈ SAR 80', tint: 'linear-gradient(135deg, #EC4899, #F59E0B)' },
      { id: 'b', initial: 'S', who: 'Saad', what: 'Coffee on Muntej', cost: '300 pts', sar: '≈ SAR 30', tint: 'linear-gradient(135deg, #F26A1B, #FFB547)' }
    ];
    const st = this.state;
    return {
      rules: rules.map((r, i) => {
        const on = !st.off[r.id];
        return Object.assign({}, r, {
          pressed: on ? 'true' : 'false', track: on ? '#1F6FEB' : '#D5DCE8', justify: on ? 'flex-end' : 'flex-start',
          divider: i === rules.length - 1 ? 'transparent' : '#EEF2F8',
          toggle: () => this.setState({ off: Object.assign({}, st.off, { [r.id]: on }) })
        });
      }),
      reqs: reqs.map((q) => Object.assign({}, q, {
        open: !st.ok[q.id], done: !!st.ok[q.id],
        approve: () => this.setState({ ok: Object.assign({}, st.ok, { [q.id]: true }) })
      }))
    };
  }
}
</script>
