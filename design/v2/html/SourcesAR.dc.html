  <section style="position: absolute; left: 22px; right: 22px; top: 228px; display: flex; justify-content: space-between; align-items: center">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 50%; background: #16A37A; box-shadow: 0 0 0 3px rgba(22,163,122,0.2)"></span>{{connectedCount}} مصادر شغّالة</span>
    <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #16A37A; background: #E3F7EF; padding: 4px 9px; border-radius: 999px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>0 تكرار</span>
  </section>

  <section style="position: absolute; left: 22px; right: 22px; top: 262px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{sources}}" as="s" hint-placeholder-count="9">
      <button type="button" onClick="{{s.toggle}}" aria-pressed="{{s.on}}" style="height: 96px; border-radius: 20px; background: #FFFFFF; border: {{s.border}}; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #0B1A33; font-family: Tajawal, sans-serif; padding: 0; box-shadow: 0 4px 14px rgba(11,42,91,0.06); cursor: pointer">
        <span class="src-tile" data-on="{{s.on}}" data-k="{{s.id}}" style="width: 40px; height: 40px; border-radius: 12px; background: {{s.chip}}; color: {{s.chipText}}; display: flex; align-items: center; justify-content: center; font-family: Tajawal, sans-serif; font-size: 13px; font-weight: 800">{{s.abbr}}</span>
        <span style="font-size: 13px; font-weight: 700">{{s.name}}</span>
        <span style="font-size: 11px; font-weight: 600; color: {{s.statusColor}}">{{s.status}}</span>

  <section style="position: absolute; left: 22px; right: 22px; top: 594px; background: #FFFFFF; border-right: 4px solid #1F6FEB; border-radius: 20px; padding: 10px 12px 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 18px rgba(11,42,91,0.07)">

  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 7px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #0B1A33; opacity: 0.85"></span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { wa: true, em: true, mt: true, te: true, sl: false, gc: false, ji: true, az: true, st: false } };
  }
  renderVals() {
    const list = [
      { id: 'wa', name: 'واتساب', abbr: 'WA', n: 5 },
      { id: 'em', name: 'الإيميل', abbr: '@', n: 3 },
      { id: 'mt', name: 'الاجتماعات', abbr: 'MT', n: 4 },
      { id: 'te', name: 'تيمز', abbr: 'TM', n: 2 },
      { id: 'sl', name: 'سلاك', abbr: 'SL', n: 2 },
      { id: 'gc', name: 'قوقل شات', abbr: 'GC', n: 1 },
      { id: 'ji', name: 'جيرا', abbr: 'JI', n: 2 },
      { id: 'az', name: 'أزور ديف أوبس', abbr: 'AZ', n: 1 },
      { id: 'st', name: 'ملاحظات ورقية', abbr: 'NT', n: 1 }
    ];
    const on = this.state.on;
    let captured = 0, count = 0;
    list.forEach((s) => { if (on[s.id]) { captured += s.n; count += 1; } });
    return {
      captured: captured,
      connectedCount: count,
      sources: list.map((s) => {
        const o = !!on[s.id];
        return Object.assign({}, s, {
          on: o ? 'true' : 'false',
          border: o ? '1.5px solid #FFFFFF' : '1.5px dashed #C9D5E8',
          chip: o ? '#1F6FEB' : '#EEF2F8',
          chipText: o ? '#FFFFFF' : '#97A1B5',
          status: o ? s.n + ' اليوم' : '+ اربطه',
          statusColor: o ? '#16A37A' : '#1F6FEB',
          toggle: () => this.setState({ on: Object.assign({}, on, { [s.id]: !o }) })
        });
      })
    };
  }
}
</script>
