        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 8px; background: #2E9BF0; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">10</span></span>

        <span style="font-size: 11px; color: rgba(255,255,255,0.85)">ريال/شهر</span>
      </div>
      <div style="background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24); border-radius: 16px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 8px; background: #F26A1B; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-7a1.5 1.5 0 0 1 3 0V12M14 11.5V6.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.3 15a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">0</span></span>
        <span style="font-size: 11px; color: rgba(255,255,255,0.85)">تذكير منك</span>

    </div>

  <section style="position: absolute; left: 22px; right: 22px; top: 192px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{agents}}" as="a" hint-placeholder-count="5">
      <div class="ag" data-k="{{a.id}}" data-on="{{a.pressed}}" style="background: #FFFFFF; box-shadow: 0 4px 18px rgba(11,42,91,0.07); border-radius: 20px; padding: 11px 14px; display: flex; align-items: center; gap: 12px; opacity: {{a.opacity}}">
        <span class="tl" style="width: 40px; height: 40px; border-radius: 12px; background: {{a.chip}}; color: {{a.chipText}}; display: flex; align-items: center; justify-content: center; flex: none">
          <svg class="ic ic-a" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
          <svg class="ic ic-b" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
          <svg class="ic ic-c" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3L2 6M19 3l3 3"/></svg>

          <svg class="ic ic-e" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 14px; font-weight: 700; line-height: 1.3">{{a.name}}</span>
          <span style="font-size: 11px; color: #66728A; display: flex; align-items: center; gap: 4px; white-space: nowrap"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>{{a.when}} · {{a.last}}</span>

      وكيل جديد

  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 7px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #0B1A33; opacity: 0.85; z-index: 5"></span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { a: true, b: true, c: true, d: true, e: true } };
  }
  renderVals() {
    const list = [
      { id: 'a', name: 'ملخص يومي ← قروب الفريق', when: 'يوميًا 8 الصبح', last: 'اشتغل اليوم ✓' },
      { id: 'b', name: 'تقرير أسبوعي ← الرئيس', when: 'الخميس 2 الظهر', last: 'اشتغل الخميس ✓' },
      { id: 'c', name: 'مهمة متأخرة ← تذكير وتصعيد', when: 'عند الحدث', last: '9 مرات هالأسبوع' },
      { id: 'd', name: 'إيميل «عرض سعر» ← فيصل', when: 'عند الحدث', last: '4 مرات هالأسبوع' },
      { id: 'e', name: 'مين يستاهل الشكر؟', when: 'الخميس 1 الظهر', last: 'اشتغل الخميس ✓' }
    ];
    const on = this.state.on;
    return {
      active: list.filter((a) => on[a.id]).length,
      agents: list.map((a) => {
        const o = !!on[a.id];
        return Object.assign({}, a, {
          pressed: o ? 'true' : 'false',
          track: o ? '#1F6FEB' : '#D6DEEA',
          justify: o ? 'flex-end' : 'flex-start',
          chip: o ? '#E8F0FE' : '#EEF1F6',
          chipText: o ? '#1F6FEB' : '#97A1B5',
          opacity: o ? '1' : '0.65',
          toggle: () => this.setState({ on: Object.assign({}, on, { [a.id]: !o }) })
        });
      })
    };
  }
}
</script>
