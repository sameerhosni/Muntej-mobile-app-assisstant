    <svg aria-hidden="true" width="8" height="8" viewBox="0 0 8 8" style="position: absolute; left: 340px; top: 118px"><circle cx="4" cy="4" r="4" fill="#FF8FB1"/></svg>

    <div aria-hidden="true" style="height: 44px; padding: 0 26px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; color: #FFFFFF; position: relative"><span>9:41</span><span style="display: flex; gap: 6px; align-items: center"><svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="currentColor"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="currentColor"/></svg><svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.2c2.2 0 4.2.9 5.7 2.3l1.1-1.1A9.6 9.6 0 0 0 7.5.6 9.6 9.6 0 0 0 .7 3.4l1.1 1.1a8 8 0 0 1 5.7-2.3zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1a6.4 6.4 0 0 0-9 0l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.2c.5 0 .9.2 1.2.5L7.5 10.3 6.3 9.1c.3-.3.7-.5 1.2-.5z" fill="currentColor"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg></span></div>

    <header style="position: relative; padding: 4px 22px 0; display: flex; align-items: center; gap: 12px">
      <a href="EmployeeHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.32); box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #FFFFFF; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600; line-height: 1.2">Levels &amp; badges</span>
        <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: rgba(255,255,255,0.9)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Reliability, not overtime · 6/9</span>
      </div>

  </section>

  <section style="position: relative; margin: -58px 22px 0; background: #FFFFFF; box-shadow: 0 8px 24px rgba(11,42,91,0.10); border-radius: 20px; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="position: relative; display: flex; justify-content: space-between; align-items: center">
      <span style="position: absolute; left: 18px; right: 18px; top: 17px; height: 4px; background: #E9EEF6; border-radius: 2px"></span>
      <span style="position: absolute; left: 18px; width: 56%; top: 17px; height: 4px; background: linear-gradient(90deg, #A78BFA, #6D4AFF); border-radius: 2px"></span>
      <sc-for list="{{levels}}" as="l" hint-placeholder-count="5">
        <span style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 60px">
          <span style="width: {{l.size}}; height: {{l.size}}; border-radius: 50%; background: {{l.bg}}; border: 3px solid {{l.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: Karla, sans-serif; font-size: 12px; font-weight: 800; color: {{l.text}}; margin-top: {{l.mt}}">{{l.n}}</span>
          <span style="font-size: 11px; color: {{l.label}}; font-weight: 700">{{l.name}}</span>
        </span>
      </sc-for>
    </div>
    <span style="font-size: 12px; color: #3B475E; text-align: center; background: #F5F2FF; border-radius: 12px; padding: 7px 10px"><b style="color: #6D4AFF">260 XP</b> → Expert · CEO lunch discount</span>
  </section>

  <section style="margin: 14px 22px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{badges}}" as="b" hint-placeholder-count="9">
      <button type="button" onClick="{{b.pick}}" aria-label="{{b.name}}" style="height: 98px; border-radius: 20px; background: {{b.cardBg}}; border: {{b.cardBorder}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; color: #0B1A33; font-family: Karla, sans-serif; padding: 0; opacity: {{b.opacity}}; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
        <span aria-hidden="true" style="position: relative; width: 46px; height: 50px; display: flex; align-items: center; justify-content: center">
          <span style="position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(150deg, {{b.color}}, {{b.ink}})"></span>
          <span style="position: absolute; inset: 4px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(160deg, rgba(255,255,255,0.32), rgba(255,255,255,0) 60%)"></span>
          <span style="position: relative; font-family: Karla, sans-serif; font-size: 13px; font-weight: 800; color: {{b.fill}}">{{b.abbr}}</span>
        </span>
        <span style="font-size: 11px; font-weight: 700">{{b.name}}</span>
      </button>
    </sc-for>
  </section>

  <section style="position: relative; margin: 14px 22px 0; background: #FFFFFF; box-shadow: 0 4px 18px rgba(11,42,91,0.07); border-radius: 20px; padding: 14px 16px 14px 18px; display: flex; flex-direction: column; gap: 6px">
    <span aria-hidden="true" style="position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: {{selColor}}"></span>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600">{{selName}}</span>
      <span style="font-size: 12px; font-weight: 700; color: {{selText}}; background: {{selTint}}; padding: 4px 10px; border-radius: 999px">{{selState}}</span>
    </div>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #3B475E; line-height: 1.4"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6D4AFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>{{selHow}}</span>
    <span style="height: 8px; border-radius: 4px; background: #E9EEF6; display: flex"><span style="width: {{selProg}}; background: linear-gradient(90deg, #6D4AFF, #2EC4D6); border-radius: 4px"></span></span>
    <span style="display: flex; align-items: center; gap: 6px; font-family: Karla, sans-serif; font-size: 13px; font-weight: 800; color: #E2580B">
      <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); color: #FFFFFF; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">#</span>
      +{{selPts}} pts
      <span style="font-size: 12px; color: #0F7A5A; background: #E3F7EF; padding: 2px 8px; border-radius: 999px">≈ SAR {{selSar}}</span>
    </span>
  </section>
  <div style="position: absolute; left: 22px; right: 22px; bottom: 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
      <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; background: #E8F0FE; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1F6FEB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">0 h</span></span>
      <span style="font-size: 11px; color: #66728A">overtime needed</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
      <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; background: #E3F7EF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16A37A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">96%</span></span>
      <span style="font-size: 11px; color: #66728A">on time</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
      <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; background: #FFF1E8; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F26A1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-7a1.5 1.5 0 0 1 3 0V12M14 11.5V6.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.3 15a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">0</span></span>
      <span style="font-size: 11px; color: #66728A">reminders</span>
    </div>
  </div>
  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 7px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #0B1A33; opacity: 0.85"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'zc' };
  }
  renderVals() {
    const L = [['1–3', 'Starter', 'done'], ['4–6', 'Achiever', 'done'], ['7', 'Pro', 'now'], ['8–9', 'Expert', 'next'], ['10', 'Legend', 'next']];
    const T = {
      green: { color: '#34D399', tint: '#E3F7EF', dark: '#0F8A66' },
      blue: { color: '#4FA3FF', tint: '#E8F0FE', dark: '#1F5FD1' },
      coral: { color: '#FF8A7A', tint: '#FDECEC', dark: '#D63A44' },
      purple: { color: '#A78BFA', tint: '#EFEBFF', dark: '#6D4AFF' },
      orange: { color: '#FFB547', tint: '#FFF1E8', dark: '#E2580B' }
    };
    const B = [
      { id: 'eb', name: 'Early Bird', abbr: 'EB', tone: 'green', got: true, how: 'Beat 5 deadlines', prog: '100%', pts: 100 },
      { id: 'pm', name: 'Proof Master', abbr: 'PM', tone: 'blue', got: true, how: '20 tasks with proof', prog: '100%', pts: 100 },
      { id: 'st', name: '10-Day Streak', abbr: '10', tone: 'coral', got: true, how: '10 on-time days in a row', prog: '100%', pts: 150 },
      { id: 'cc', name: 'Clarity Champ', abbr: 'CC', tone: 'purple', got: true, how: '10 tasks clear before start', prog: '100%', pts: 80 },
      { id: 'tp', name: 'Team Player', abbr: 'TP', tone: 'orange', got: true, how: 'Helped 3 teammates', prog: '100%', pts: 120 },
      { id: 'fs', name: 'Five Stars', abbr: '5★', tone: 'orange', got: true, how: 'Five 5★ reviews', prog: '100%', pts: 150 },
      { id: 'zc', name: 'Zero Chase', abbr: 'ZC', tone: 'green', got: false, how: 'A month with zero reminders · 19/22 days', prog: '86%', pts: 300 },
      { id: 'rh', name: 'Ramadan Hero', abbr: 'RH', tone: 'purple', got: false, how: '90%+ on time in Ramadan', prog: '40%', pts: 200 },
      { id: 'mn', name: 'Mentor', abbr: 'MN', tone: 'blue', got: false, how: '10 teamwork kudos', prog: '30%', pts: 250 }
    ];
    const st = this.state;
    const sel = B.find((b) => b.id === st.sel);
    const selT = T[sel.tone];
    return {
      levels: L.map((l) => ({
        n: l[0], name: l[1],
        size: l[2] === 'now' ? '40px' : '32px', mt: l[2] === 'now' ? '-4px' : '0',
        bg: l[2] === 'now' ? 'linear-gradient(135deg, #6D4AFF, #2EC4D6)' : (l[2] === 'done' ? '#EFEBFF' : '#FFFFFF'),
        border: l[2] === 'next' ? '#D6DDE8' : (l[2] === 'now' ? '#FFFFFF' : '#A78BFA'),
        text: l[2] === 'now' ? '#FFFFFF' : (l[2] === 'done' ? '#6D4AFF' : '#97A1B5'),
        label: l[2] === 'now' ? '#6D4AFF' : '#66728A'
      })),
      badges: B.map((b) => {
        const t = T[b.tone];
        return {
          name: b.name, abbr: b.abbr,
          color: b.got ? t.color : '#EEF2F8',
          ink: b.got ? t.dark : '#D6DDE8',
          fill: b.got ? t.tint : '#97A1B5',
          cardBg: b.id === st.sel ? '#F5F2FF' : '#FFFFFF',
          cardBorder: b.id === st.sel ? '1px solid ' + (b.got ? t.color : '#6D4AFF') : '1px solid #EEF2F8',
          opacity: b.got || b.id === st.sel ? '1' : '0.8',
          pick: () => this.setState({ sel: b.id })
        };
      }),
      selName: sel.name, selHow: sel.how, selPts: sel.pts, selProg: sel.prog, selSar: sel.pts / 10,
      selState: sel.got ? 'Unlocked' : 'In progress',
      selColor: sel.got ? selT.color : '#E8900C',
      selText: sel.got ? selT.dark : '#8A5A00',
      selTint: sel.got ? selT.tint : '#FFF4E0'
    };
  }
}
</script>
</body>
</html>
