<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>منتج - صائد الوعود</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;family=Karla:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F6FB}
a{color:#1F6FEB;text-decoration:none}a:hover{color:#1557C0}
.av{background:linear-gradient(135deg,#64748B,#94A3B8)}
.av[data-i="F"]{background:linear-gradient(135deg,#1F6FEB,#2EC4D6)}
.av[data-i="ف"]{background:linear-gradient(135deg,#1F6FEB,#2EC4D6)}
.av[data-i="A"]{background:linear-gradient(135deg,#6D4AFF,#A78BFA)}
.av[data-i="ع"]{background:linear-gradient(135deg,#6D4AFF,#A78BFA)}
.av[data-i="N"]{background:linear-gradient(135deg,#EC4899,#F59E0B)}
.av[data-i="ن"]{background:linear-gradient(135deg,#EC4899,#F59E0B)}
.av[data-i="K"]{background:linear-gradient(135deg,#0EA5A4,#34D399)}
.av[data-i="خ"]{background:linear-gradient(135deg,#0EA5A4,#34D399)}
.av[data-i="Y"]{background:linear-gradient(135deg,#0B2A5B,#1F6FEB)}
.av[data-i="أ"]{background:linear-gradient(135deg,#0B2A5B,#1F6FEB)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F6FB; color: #0B1A33; font-family: Tajawal, sans-serif; direction: rtl; box-sizing: border-box">

  <div aria-hidden="true" style="height: 44px; padding: 0 26px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; color: #0B1A33; direction: rtl; font-family: Karla, sans-serif"><span>9:41</span><span style="display: flex; gap: 6px; align-items: center"><svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="currentColor"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="currentColor"/></svg><svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.2c2.2 0 4.2.9 5.7 2.3l1.1-1.1A9.6 9.6 0 0 0 7.5.6 9.6 9.6 0 0 0 .7 3.4l1.1 1.1a8 8 0 0 1 5.7-2.3zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1a6.4 6.4 0 0 0-9 0l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.2c.5 0 .9.2 1.2.5L7.5 10.3 6.3 9.1c.3-.3.7-.5 1.2-.5z" fill="currentColor"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg></span></div>

  <header style="padding: 2px 22px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #1F6FEB; background: #E8F0FE; padding: 4px 4px 4px 12px; border-radius: 999px">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #1F6FEB, #2EC4D6); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/></svg>
        </span>
        اجتماع المبيعات · 42 د
      </span>
      <a href="MainAR.dc.html" aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 14px rgba(11,42,91,0.10); box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #0B1A33">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </div>
    <span style="font-family: Tajawal, sans-serif; font-size: 24px; font-weight: 800; line-height: 1.25">لقطنا <span style="font-family: Tajawal, sans-serif; font-weight: 800; color: #FFFFFF; background: linear-gradient(135deg, #1F6FEB, #2E9BF0); padding: 0 9px; border-radius: 9px; box-shadow: 0 4px 10px rgba(31,111,235,0.28)">{{total}}</span> وعود</span>
  </header>

  <section style="margin: 12px 22px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
      <span style="display: flex; align-items: center; gap: 7px"><span style="width: 26px; height: 26px; border-radius: 8px; background: #E3F7EF; color: #16A37A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span><span style="font-size: 19px; font-weight: 800">0</span></span>
      <span style="font-size: 11px; color: #66728A; white-space: nowrap">وعد منسي</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
      <span style="display: flex; align-items: center; gap: 7px"><span style="width: 26px; height: 26px; border-radius: 8px; background: #E8F0FE; color: #1F6FEB; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span style="font-size: 19px; font-weight: 800; white-space: nowrap">40د</span></span>
      <span style="font-size: 11px; color: #66728A; white-space: nowrap">تدوين وفّرته</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
      <span style="display: flex; align-items: center; gap: 7px"><span style="width: 26px; height: 26px; border-radius: 8px; background: #FFF1E8; color: #F26A1B; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/></svg></span><span style="font-size: 19px; font-weight: 800">133</span></span>
      <span style="font-size: 11px; color: #66728A; white-space: nowrap">ريال وفّرتها</span>
    </div>
  </section>

  <div style="margin: 12px 22px 0; display: flex; align-items: center; gap: 10px">
    <span style="flex: 1; height: 8px; border-radius: 4px; background: #E9EEF6; display: flex; overflow: hidden">
      <span style="width: {{pct}}; background: linear-gradient(270deg, #1F6FEB, #2EC4D6); border-radius: 4px"></span>
    </span>
    <span style="font-size: 12px; font-weight: 800; color: #1F6FEB">{{pct}}</span>
  </div>

  <section style="margin: 12px 22px 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border-radius: 20px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 18px rgba(11,42,91,0.07)">
        <div style="display: flex; align-items: center; gap: 10px">
          <span class="av" data-i="{{it.initial}}" style="width: 38px; height: 38px; border-radius: 50%; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: none; box-shadow: 0 3px 8px rgba(11,42,91,0.15)">{{it.initial}}</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="font-weight: 700; font-size: 14px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.task}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #66728A">{{it.who}}<span style="display: flex; align-items: center; gap: 4px; color: #1F6FEB; background: #E8F0FE; font-weight: 700; padding: 1px 7px; border-radius: 999px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>{{it.due}}</span></span>
          </div>
          <sc-if value="{{it.open}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; gap: 6px; flex: none">
              <button type="button" onClick="{{it.skip}}" aria-label="مو مهمة" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #D6E2F5; background: #FFFFFF; color: #66728A; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
              <button type="button" onClick="{{it.confirm}}" aria-label="تأكيد" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: linear-gradient(135deg, #1F6FEB, #2E9BF0); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 14px rgba(31,111,235,0.30)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
              </button>
            </div>
          </sc-if>
          <sc-if value="{{it.confirmed}}" hint-placeholder-val="{{ false }}">
            <span style="flex: none; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #16A37A; background: #E3F7EF; padding: 6px 10px; border-radius: 999px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>مهمة</span>
          </sc-if>
          <sc-if value="{{it.skipped}}" hint-placeholder-val="{{ false }}">
            <span style="flex: none; font-size: 12px; font-weight: 600; color: #66728A; background: #EEF2F8; padding: 6px 10px; border-radius: 999px">تخطّيناها</span>
          </sc-if>
        </div>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #3B475E; background: #F3F6FB; border-radius: 10px; padding: 5px 9px; white-space: nowrap; overflow: hidden">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9CC0F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          <span style="flex: 1; overflow: hidden; text-overflow: ellipsis">"{{it.quote}}"</span>
          <span style="font-family: Tajawal, sans-serif; color: #97A1B5; flex: none">{{it.time}}</span>
        </span>
      </div>
    </sc-for>
  </section>

  <div style="position: absolute; left: 22px; right: 22px; bottom: 26px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" onClick="{{confirmAll}}" style="height: 52px; border-radius: 999px; border: none; background: linear-gradient(135deg, #1F6FEB, #2E9BF0); color: #FFFFFF; font-family: Tajawal, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(31,111,235,0.30)">{{cta}}</button>
    <span style="display: flex; justify-content: center; gap: 8px; font-size: 11px; font-weight: 600; color: #66728A; white-space: nowrap">
      <span style="display: flex; align-items: center; gap: 5px; background: #FFFFFF; padding: 4px 9px; border-radius: 999px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16A37A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>تأكيد بالواتساب</span>
      <span style="display: flex; align-items: center; gap: 5px; background: #FFFFFF; padding: 4px 9px; border-radius: 999px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); color: #FFFFFF; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center">#</span><span style="color: #E2580B; font-weight: 700">+نقاط</span> لو وفى</span>
    </span>
  </div>
  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 7px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #0B1A33; opacity: 0.85"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { s: {} };
  }
  renderVals() {
    const base = [
      { id: 'a', initial: 'ف', who: 'فيصل', due: 'الأربعاء', task: 'عرض سعر للراجحي', quote: 'أبشر، يوصلك الأربعاء', time: '12:04' },
      { id: 'b', initial: 'ع', who: 'عبدالله', due: 'بكرة', task: 'تحديث أرقام الربع 3', quote: 'برسلها لك بكرة', time: '18:41' },
      { id: 'c', initial: 'ن', who: 'نورة', due: 'الخميس', task: 'موعد عرض لسُبل', quote: 'بكلمهم وأرتّبها', time: '27:10' },
      { id: 'd', initial: 'أ', who: 'أنت', due: 'الأحد', task: 'اعتماد الخصم الجديد', quote: 'أرد عليك الأحد', time: '39:55' }
    ];
    const s = this.state.s;
    const set = (id, v) => this.setState({ s: Object.assign({}, s, { [id]: v }) });
    const done = base.filter((b) => s[b.id]).length;
    const left = base.length - done;
    return {
      total: base.length,
      pct: Math.round((done / base.length) * 100) + '%',
      cta: left === 0 ? 'تم، انسَ الاجتماع' : 'أكّد الكل (' + left + ')',
      confirmAll: () => { const n = {}; base.forEach((b) => { n[b.id] = s[b.id] || 'ok'; }); this.setState({ s: n }); },
      items: base.map((b) => Object.assign({}, b, {
        open: !s[b.id],
        confirmed: s[b.id] === 'ok',
        skipped: s[b.id] === 'skip',
        confirm: () => set(b.id, 'ok'),
        skip: () => set(b.id, 'skip')
      }))
    };
  }
}
</script>
</body>
</html>
