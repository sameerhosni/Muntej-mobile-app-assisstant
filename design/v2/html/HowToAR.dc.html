  <section style="position: relative; margin: 20px 22px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 700; color: #66728A">أكثر الأسئلة</span>
    <sc-for list="{{qs}}" as="q" hint-placeholder-count="4">
      <button type="button" onClick="{{q.pick}}" aria-pressed="{{q.pressed}}" style="text-align: right; height: 50px; padding: 0 8px 0 12px; border-radius: 16px; border: 1px solid {{q.border}}; background: {{q.bg}}; color: #0B1A33; font-family: Tajawal, sans-serif; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 3px 12px rgba(11,42,91,0.05)">

        <span style="flex: 1">{{q.text}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F6FEB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </sc-for>

  <section style="position: relative; margin: 16px 22px 0; background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(11,42,91,0.09); overflow: hidden">
    <div style="background: linear-gradient(135deg, #E8F0FE, #E3F6FA); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
      <span style="display: flex; justify-content: space-between; align-items: center">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: #1F6FEB"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(150deg, #0B2A5B, #1F6FEB 60%, #2EC4D6); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg></span>منتج</span>

      </span>
      <span style="font-size: 16px; font-weight: 800">{{title}}</span>
    </div>
    <div style="padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 9px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; gap: 10px; align-items: center">
          <span style="width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #1F6FEB, #2EC4D6); color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">{{s.n}}</span>
          <span style="font-size: 14px; font-weight: 600; color: #3B475E">{{s.t}}</span>
        </div>
      </sc-for>
      <div style="display: flex; gap: 8px; margin-top: 4px">
        <a href="{{showHref}}" style="flex: 1; height: 46px; border-radius: 999px; background: linear-gradient(135deg, #1F6FEB, #2E9BF0); color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(31,111,235,0.30)">وريني</a>
        <button type="button" onClick="{{doIt}}" style="flex: 1; height: 46px; border-radius: 999px; border: 1px solid #D6E2F5; background: {{doBg}}; color: {{doColor}}; font-family: Tajawal, sans-serif; font-size: 14px; font-weight: 700">{{doLabel}}</button>
      </div>
    </div>
  </section>

  <div style="position: absolute; right: 22px; left: 22px; bottom: 98px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">

      <span style="font-size: 11px; color: #66728A">ثواني للجواب</span>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
      <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; background: #FFF1E8; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F26A1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-7a1.5 1.5 0 0 1 3 0V12M14 11.5V6.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.3 15a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">0</span></span>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 0, did: {} };
  }
  renderVals() {
    const Q = [
      { text: 'كيف أعطي أحد مهمة؟', title: 'بس قلها بصوتك', href: 'CaptureAR.dc.html', act: 'جرّب مهمة الحين', val: 'توفّر 25 دقيقة', tint: '#E8F0FE', ink: '#1F6FEB', icon: 'M9 3h6v11H9zM5 11a7 7 0 0 0 14 0M12 18v3',
        steps: ['اضغط المايك وتكلّم', 'منتج يحدد مين ومتى', 'يرسلها واتساب ويتابع عنك'] },
      { text: 'كيف تشتغل النقاط؟', title: 'النقاط للالتزام، مو للسهر', href: 'PointsControlAR.dc.html', act: 'استخدم الإعدادات الأساسية', val: '10 نقاط ≈ 1 ريال', tint: '#FFF1E8', ink: '#F26A1B', icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9 9h6M9 15h6M10.5 6.5l-1 11M14.5 6.5l-1 11',
        steps: ['بالوقت 50+ · الإثبات 15+', 'ميزانية شهرية ما تتعداها', 'أنت توافق على كل مكافأة'] },
      { text: 'أوقف الرسائل بعد الدوام', title: 'أوقات الهدوء شغّالة', href: 'AlertsAR.dc.html', act: 'خلها مثل ما هي', val: 'بدون إعداد', tint: '#EFEBFF', ink: '#6D4AFF', icon: 'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z',
        steps: ['أوقات الصلاة مضبوطة', 'تنتظر لين الصباح', 'العاجل يوصلك على طول'] },
      { text: 'كيف أضيف فريق ثاني؟', title: 'فريق جديد بدقيقة', href: 'GrowAR.dc.html', act: 'ابدأ فريق جديد', val: '25 ساعة/شهر', tint: '#E3F7EF', ink: '#16A37A', icon: 'M17 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M10 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M20 8v6M17 11h6',
        steps: ['افتح «توسّع» ← فريق جديد', 'صوّر قائمة أو شارك رابط', 'إعداداتك تنتقل معه'] }
    ];
    const st = this.state;
    const cur = Q[st.q];
    const did = !!st.did[st.q];
    return {
      qs: Q.map((x, i) => ({ text: x.text, tint: i === st.q ? '#FFFFFF' : x.tint, ink: x.ink, icon: x.icon, pressed: i === st.q ? 'true' : 'false', bg: i === st.q ? '#E8F0FE' : '#FFFFFF', border: i === st.q ? '#1F6FEB' : '#FFFFFF', pick: () => this.setState({ q: i }) })),
      title: cur.title, showHref: cur.href, val: cur.val,
      steps: cur.steps.map((t, i) => ({ n: i + 1, t: t })),
      doLabel: did ? 'سوّيناها ✓' : 'سوّها عني', doBg: did ? '#E3F7EF' : '#FFFFFF', doColor: did ? '#0F7A5A' : '#1F6FEB',
      doIt: () => this.setState({ did: Object.assign({}, st.did, { [st.q]: true }) })
    };
  }
}
</script>
