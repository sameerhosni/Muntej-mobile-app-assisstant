    const g = !!st.gen[st.tab];
    return {
      tabs: [['p', 'مشروع'], ['r', 'منصة'], ['e', 'موظف']].map((x) => ({
        label: x[1], sel: st.tab === x[0] ? 'true' : 'false',
        bg: st.tab === x[0] ? '#1F6FEB' : '#FFFFFF',
        color: st.tab === x[0] ? '#FFFFFF' : '#0B1A33',
        border: st.tab === x[0] ? '1px solid #1F6FEB' : '1px solid #FFFFFF',
        pick: () => this.setState({ tab: x[0] })
      })),
      initial: t.initial, subject: t.subject, meta: t.meta, score: t.score,
      isGen: g, notGen: !g,
      gen: () => this.setState({ gen: Object.assign({}, st.gen, { [st.tab]: true }) }),
      bullets: t.bullets.map((b) => ({ text: b[0], dot: b[1] })),
      showFeedback: g && st.tab === 'e' && !st.sent,
      feedbackSent: g && st.tab === 'e' && st.sent,
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
