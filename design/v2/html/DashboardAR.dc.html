          <span style="font-family: Tajawal, sans-serif; font-size: 12px; font-weight: 700; color: {{k.dColor}}">{{k.delta}}</span>

  <section aria-label="التوفير" style="position: absolute; left: 22px; right: 22px; top: 368px; background: linear-gradient(135deg, #E8F0FE, #E3F7EF); border-radius: 18px; padding: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <div style="background: #FFFFFF; border-radius: 13px; padding: 8px 9px; display: flex; flex-direction: column; gap: 3px">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 8px; background: #E8F0FE; color: #1F6FEB; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">{{val.h}}</span></span>
      <span style="font-size: 11px; color: #66728A; white-space: nowrap">ساعة وفّرتها</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 13px; padding: 8px 9px; display: flex; flex-direction: column; gap: 3px">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 8px; background: #E3F7EF; color: #16A37A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/></svg></span><span style="font-size: 18px; font-weight: 800; white-space: nowrap">{{val.sar}}</span></span>
      <span style="font-size: 11px; color: #66728A; white-space: nowrap">ريال وفّرتها</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 13px; padding: 8px 9px; display: flex; flex-direction: column; gap: 3px">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 8px; background: #FFF1E8; color: #F26A1B; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-7a1.5 1.5 0 0 1 3 0V12M14 11.5V6.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.3 15a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg></span><span style="font-size: 18px; font-weight: 800">0</span></span>
      <span style="font-size: 11px; color: #66728A; white-space: nowrap">ملاحقة</span>
    </div>
  </section>

  <section style="position: absolute; left: 22px; right: 22px; top: 448px; background: #FFFFFF; border-radius: 20px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 18px rgba(11,42,91,0.07)">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: Tajawal, sans-serif; font-size: 16px; font-weight: 800">المهام المنجزة</span>
      <span style="display: flex; gap: 10px; font-size: 11px; color: #3B475E">
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 2px; background: linear-gradient(180deg, #2EC4D6, #1F6FEB)"></span>{{periodShort}}</span>
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #D6DEEA"></span>السابق</span>
      </span>
    </div>
    <div role="img" aria-label="المهام المنجزة مقارنة بالفترة السابقة" style="height: 96px; display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; border-bottom: 1px solid #E6EBF3; background: repeating-linear-gradient(180deg, transparent 0 30px, #F1F4F9 30px 31px)">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span style="font-family: Tajawal, sans-serif; font-size: 11px; font-weight: 800; color: #1F6FEB">{{b.cur}}</span>
          <div style="display: flex; align-items: flex-end; gap: 3px">
            <span style="width: 14px; height: {{b.hCur}}; background: linear-gradient(180deg, #2EC4D6, #1F6FEB); border-radius: 5px 5px 0 0; box-shadow: 0 4px 10px rgba(31,111,235,0.25)"></span>
            <span style="width: 14px; height: {{b.hPrev}}; background: #D6DEEA; border-radius: 5px 5px 0 0"></span>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; gap: 6px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
        <span style="flex: 1; text-align: center; font-size: 11px; color: #66728A">{{b.label}}</span>
      </sc-for>
    </div>
  </section>

  <section aria-label="التفاعل" style="position: absolute; left: 22px; right: 22px; top: 638px; background: #FFFFFF; border-radius: 20px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; white-space: nowrap; box-shadow: 0 4px 18px rgba(11,42,91,0.07)">
    <span style="display: flex; align-items: center; gap: 8px">
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 3px 8px rgba(242,106,27,0.35)">#</span>

    <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 7px; background: #FFF1E8; color: #F26A1B; display: flex; align-items: center; justify-content: center; flex: none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 1.5 3 1-2 1.5-5 1.5-8z"/></svg></span><span style="display: flex; flex-direction: column"><span style="font-family: Tajawal, sans-serif; font-size: 16px; font-weight: 800; color: #F26A1B">{{eng.streaks}}</span><span style="font-size: 11px; color: #66728A">سلسلة</span></span></span>

  <section style="position: absolute; left: 22px; right: 22px; top: 712px; background: #FFFFFF; border-right: 4px solid #1F6FEB; border-radius: 20px; padding: 10px 12px 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 18px rgba(11,42,91,0.07)">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5z"/></svg>
    </span>
    <span style="font-size: 14px; font-weight: 600; line-height: 1.4; color: #0B1A33">{{insight}}</span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p: 'w' };
  }
  renderVals() {
    const data = {
      d: { label: 'اليوم', prev: 'أمس', short: 'اليوم', labels: ['8ص', '10ص', '12م', '2م', '4م'], cur: [3, 5, 4, 6, 2], prv: [2, 4, 4, 3, 3],
        kpis: [['المنجزة', '20', '+25%', 1], ['بوقتها', '90%', '+4', 1], ['التقييم', '4.3', '+0.2', 1], ['الوضوح', '84%', '-2', 0]],
        eng: { pts: '410', kudos: '4', streaks: '3' },
        val: { h: '1.2', sar: '240' },
        insight: 'الذروة 2 الظهر · اجتمعوا قبل 10' },
      w: { label: 'هالأسبوع', prev: 'الأسبوع اللي فات', short: 'هالأسبوع', labels: ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'], cur: [8, 12, 9, 14, 11], prv: [7, 9, 10, 8, 9],
        kpis: [['المنجزة', '54', '+26%', 1], ['بوقتها', '87%', '+6', 1], ['التقييم', '4.1', '+0.3', 1], ['الوضوح', '86%', '+9', 1]],
        eng: { pts: '2,340', kudos: '18', streaks: '3' },
        val: { h: '6.2', sar: '1,240' },
        insight: 'طلبات أوضح = تأخير أقل' },
      m: { label: 'هالشهر', prev: 'الشهر اللي فات', short: 'هالشهر', labels: ['أسبوع 1', 'أسبوع 2', 'أسبوع 3', 'أسبوع 4'], cur: [42, 51, 48, 56], prv: [38, 40, 45, 44],
        kpis: [['المنجزة', '197', '+18%', 1], ['بوقتها', '84%', '+3', 1], ['التقييم', '4.0', '0.0', 1], ['الوضوح', '83%', '+11', 1]],
        eng: { pts: '9,870', kudos: '61', streaks: '5' },
        val: { h: '25.8', sar: '5,160' },
        insight: 'خالد أسرع 40% · ونورة الأعلى تقييم' }
    };
    const p = this.state.p;
    const ic = [['M4 4h16v16H4zM8 12l3 3 5-6', '#E8F0FE', '#1F6FEB'], ['M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2', '#E3F7EF', '#16A37A'], ['M12 3l2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1L3.2 9.4l6.1-.8z', '#FFF4E0', '#E8900C'], ['M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0', '#EFEBFF', '#6D4AFF']];
    const d = data[p];
    const max = Math.max.apply(null, d.cur.concat(d.prv));
    const h = (v) => Math.round((v / max) * 70) + 'px';
    return {
      periodLabel: d.label, prevLabel: d.prev, periodShort: d.short, insight: d.insight, eng: d.eng, val: d.val,
      tabs: [['d', 'يومي'], ['w', 'أسبوعي'], ['m', 'شهري']].map((t) => ({
        label: t[1], sel: p === t[0] ? 'true' : 'false',
        bg: p === t[0] ? '#FFFFFF' : 'transparent', color: p === t[0] ? '#1F6FEB' : 'rgba(255,255,255,0.85)',
        pick: () => this.setState({ p: t[0] })
      })),
      kpis: d.kpis.map((k, i) => ({ label: k[0], value: k[1], delta: (k[3] ? '\u200E▲ ' : '\u200E▼ ') + k[2], dColor: k[3] ? '#16A37A' : '#E5484D', icon: ic[i][0], tint: ic[i][1], stroke: ic[i][2] })),
      bars: d.labels.map((l, i) => ({ label: l, cur: d.cur[i], hCur: h(d.cur[i]), hPrev: h(d.prv[i]) }))
    };
  }
}
</script>
</body>
