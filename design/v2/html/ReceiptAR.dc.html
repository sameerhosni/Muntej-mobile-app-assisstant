<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p: 'w', shared: false };
  }
  renderVals() {
    const D = {
      w: { lines: [['متابعة أرسلها', '124'], ['تحديث جمعه', '58'], ['وعود صارت مهام', '11'], ['قرار جهّزه', '9']], effort: '0', hours: '6.2', sar: '1,240' },
      m: { lines: [['متابعة أرسلها', '512'], ['تحديث جمعه', '241'], ['وعود صارت مهام', '46'], ['قرار جهّزه', '37']], effort: '2', hours: '25.8', sar: '5,160' }
    };
    const ICO = [
      ['#E8F0FE', '#1F6FEB', 'M22 2L11 13M22 2l-7 20-4-9-9-4z'],
      ['#EFEBFF', '#6D4AFF', 'M4 4h16v12H8l-4 4zM8 9h8M8 12h5'],
      ['#E3F7EF', '#16A37A', 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9'],
      ['#FFF4E0', '#E8900C', 'M12 3a6 6 0 0 0-4 10.5V17h8v-3.5A6 6 0 0 0 12 3zM9 21h6']
    ];
    const st = this.state;
    const d = D[st.p];
    return {
      lines: d.lines.map((l, i) => ({ label: l[0], value: l[1], bg: ICO[i][0], col: ICO[i][1], icon: ICO[i][2] })),
      hours: d.hours, sar: d.sar, effort: d.effort,
      shareLabel: st.shared ? 'الصورة جاهزة للمشاركة' : 'شارك الفاتورة',
      share: () => this.setState({ shared: true }),
      tabs: [['w', 'هالأسبوع'], ['m', 'هالشهر']].map((t) => ({
        label: t[1], sel: st.p === t[0] ? 'true' : 'false',
        bg: st.p === t[0] ? '#FFFFFF' : 'transparent', color: st.p === t[0] ? '#1F6FEB' : '#FFFFFF',
        pick: () => this.setState({ p: t[0] })
      }))
    };
  }
}
</script>
