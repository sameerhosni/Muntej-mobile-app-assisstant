    <div style="position: relative; margin: 14px 22px 0; display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">

          <span style="font-size: 14px; color: rgba(255,255,255,0.82)">pts</span>
          <span style="align-self: center; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; color: #0F7A5A; background: #E3F7EF; padding: 3px 9px; border-radius: 999px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>≈ SAR {{sar}}</span>
        </span>
        <span style="display: flex; gap: 6px; font-size: 12px; font-weight: 700; margin-top: 4px"><span style="background: rgba(255,255,255,0.16); padding: 3px 9px; border-radius: 999px; color: #5BF0B5">▲ +410 this week</span><span style="background: rgba(255,255,255,0.16); padding: 3px 9px; border-radius: 999px">∞ never expires</span></span>
      </div>
      <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; flex: none">
        <span style="width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); color: #FFFFFF; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(242,106,27,0.45)">#</span>
      </span>
    </div>
  </section>

  <section style="position: relative; flex: none; margin: -26px 22px 0; background: #FFFFFF; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 24px rgba(11,42,91,0.10)">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #66728A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6D4AFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5z"/></svg>Earn</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: #0B1A33">
      <span style="display: flex; align-items: center; gap: 5px; background: #F6F8FC; padding: 3px 9px 3px 3px; border-radius: 999px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: #E8F0FE; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F6FEB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>On time <b style="color: #E2580B">+50</b></span>
      <span style="display: flex; align-items: center; gap: 5px; background: #F6F8FC; padding: 3px 9px 3px 3px; border-radius: 999px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: #EFEBFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6D4AFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span>Early <b style="color: #E2580B">+20</b></span>
      <span style="display: flex; align-items: center; gap: 5px; background: #F6F8FC; padding: 3px 9px 3px 3px; border-radius: 999px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: #E0F7FA; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E9AAE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></span>Proof <b style="color: #E2580B">+15</b></span>
      <span style="display: flex; align-items: center; gap: 5px; background: #F6F8FC; padding: 3px 9px 3px 3px; border-radius: 999px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: #FFF4E0; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E8900C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span>5★ <b style="color: #E2580B">+30</b></span>
      <span style="display: flex; align-items: center; gap: 5px; background: #F6F8FC; padding: 3px 9px 3px 3px; border-radius: 999px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: #E3F7EF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16A37A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg></span>Help <b style="color: #E2580B">+25</b></span>
      <span style="display: flex; align-items: center; gap: 5px; background: #F6F8FC; padding: 3px 9px 3px 3px; border-radius: 999px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: #FDECEC; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>Kudos <b style="color: #E2580B">+10–50</b></span>
    </div>
  </section>

  <section style="margin: 14px 22px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{items}}" as="r" hint-placeholder-count="6">
      <div style="background: #FFFFFF; box-shadow: 0 4px 18px rgba(11,42,91,0.07); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 8px; opacity: {{r.opacity}}">
        <span style="display: flex; align-items: center; gap: 8px"><span style="width: 40px; height: 40px; border-radius: 12px; background: {{r.chip}}; color: {{r.icon}}; display: flex; align-items: center; justify-content: center; font-family: Karla, sans-serif; font-size: 13px; font-weight: 800; flex: none">{{r.abbr}}</span><span style="font-size: 13px; font-weight: 700; line-height: 1.3">{{r.name}}</span></span>
        <span style="display: flex; align-items: center; gap: 6px; font-family: Karla, sans-serif; font-size: 14px; font-weight: 800; color: #E2580B">
          <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #F26A1B); color: #FFFFFF; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">#</span>
          <span style="white-space: nowrap">{{r.costLabel}}</span>
          <span style="margin-left: auto; font-size: 11px; font-weight: 800; color: #0F7A5A; background: #E3F7EF; padding: 2px 7px; border-radius: 999px; white-space: nowrap">{{r.sarLabel}}</span>
        </span>
        <button type="button" onClick="{{r.redeem}}" style="height: 36px; border-radius: 999px; border: {{r.btnBorder}}; background: {{r.btnBg}}; color: {{r.btnColor}}; font-family: Karla, sans-serif; font-size: 13px; font-weight: 700">{{r.btn}}</button>
      </div>
    </sc-for>
  </section>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(11,42,91,0.18); border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #E3F7EF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16A37A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
      <span style="font-size: 13px; color: #0B1A33; line-height: 1.5">{{toast}}</span>
    </div>
  </sc-if>
  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 7px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #0B1A33; opacity: 0.85"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { spent: 0, got: {}, last: '' };
  }
  renderVals() {
    const R = [
      { id: 'c', name: 'Coffee on Muntej', abbr: 'CF', cost: 300, chip: '#FFF1E8', icon: '#F26A1B' },
      { id: 'd', name: 'Donate to charity', abbr: 'DN', cost: 500, chip: '#E3F7EF', icon: '#16A37A' },
      { id: 'h', name: 'Leave 1 h early', abbr: '1H', cost: 800, chip: '#E8F0FE', icon: '#1F6FEB' },
      { id: 'p', name: 'Parking 1 week', abbr: 'P', cost: 1500, chip: '#EFEBFF', icon: '#6D4AFF' },
      { id: 'l', name: 'Lunch with CEO', abbr: 'LN', cost: 2500, chip: '#FDECEC', icon: '#E5484D' },
      { id: 'r', name: 'Remote day', abbr: 'RD', cost: 4000, chip: '#E0F7FA', icon: '#0E9AAE' }
    ];
    const st = this.state;
    const bal = 3480 - st.spent;
    return {
      balance: bal.toLocaleString('en-US'),
      sar: Math.floor(bal / 10).toLocaleString('en-US'),
      hasToast: !!st.last,
      toast: st.last,
      items: R.map((r) => {
        const got = !!st.got[r.id];
        const can = bal >= r.cost;
        return Object.assign({}, r, {
          costLabel: r.cost.toLocaleString('en-US') + ' pts',
          sarLabel: 'SAR ' + (r.cost / 10).toLocaleString('en-US'),
          opacity: can || got ? '1' : '0.75',
          btn: got ? 'Requested' : (can ? 'Redeem' : (r.cost - bal).toLocaleString('en-US') + ' to go'),
          btnBg: got ? '#E3F7EF' : (can ? 'linear-gradient(135deg, #6D4AFF, #1F6FEB)' : '#F3F6FB'),
          btnColor: got ? '#16A37A' : (can ? '#FFFFFF' : '#66728A'),
          btnBorder: got ? '1px solid #BDEBD8' : (can ? '1px solid transparent' : '1px solid #E6EBF3'),
          redeem: () => {
            if (got || !can) return;
            this.setState({ spent: st.spent + r.cost, got: Object.assign({}, st.got, { [r.id]: true }), last: r.name + ' requested · Ahmed approves in 1 tap' });
          }
        });
      })
    };
  }
}
</script>
