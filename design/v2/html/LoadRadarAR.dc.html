<style>

.av[data-i="A"]{background:linear-gradient(135deg,#6D4AFF,#A78BFA)}
.av[data-i="ع"]{background:linear-gradient(135deg,#6D4AFF,#A78BFA)}
.av[data-i="N"]{background:linear-gradient(135deg,#EC4899,#F59E0B)}
.av[data-i="ن"]{background:linear-gradient(135deg,#EC4899,#F59E0B)}
.av[data-i="K"]{background:linear-gradient(135deg,#0EA5A4,#34D399)}
.av[data-i="خ"]{background:linear-gradient(135deg,#0EA5A4,#34D399)}
</style>
</helmet>

  <div aria-hidden="true" style="height: 44px; padding: 0 26px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; color: #0B1A33; direction: rtl; font-family: Karla, sans-serif"><span>9:41</span><span style="display: flex; gap: 6px; align-items: center"><svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="currentColor"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="currentColor"/></svg><svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.2c2.2 0 4.2.9 5.7 2.3l1.1-1.1A9.6 9.6 0 0 0 7.5.6 9.6 9.6 0 0 0 .7 3.4l1.1 1.1a8 8 0 0 1 5.7-2.3zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1a6.4 6.4 0 0 0-9 0l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.2c.5 0 .9.2 1.2.5L7.5 10.3 6.3 9.1c.3-.3.7-.5 1.2-.5z" fill="currentColor"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg></span></div>

  <header style="padding: 6px 22px 0; display: flex; flex-direction: column; gap: 6px">
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #1F6FEB"><span style="width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #1F6FEB, #2EC4D6); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6"/></svg></span>مين ياخذها؟</span>
    <span style="font-family: Tajawal, sans-serif; font-size: 26px; font-weight: 800; line-height: 1.2">تقرير المنافسين</span>
    <span style="display: flex; gap: 8px; font-size: 13px; font-weight: 600; color: #3B475E">
      <span style="display: flex; align-items: center; gap: 5px; background: #FFFFFF; padding: 5px 10px; border-radius: 999px; box-shadow: 0 2px 10px rgba(11,42,91,0.06)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6D4AFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>8 ساعات تقريباً</span>
      <span style="display: flex; align-items: center; gap: 5px; background: #FFFFFF; padding: 5px 10px; border-radius: 999px; box-shadow: 0 2px 10px rgba(11,42,91,0.06)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E8900C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>الأحد 25 أكتوبر</span>
    </span>
  </header>

  <div style="margin: 14px 22px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #66728A">
    <span style="font-weight: 700; letter-spacing: 0.4px">الضغط هالأسبوع</span>
    <span style="display: flex; gap: 10px">
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #16A37A"></span>مرتاح</span>
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E8900C"></span>قريب</span>
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E5484D"></span>زايد</span>
    </span>
  </div>

  <section style="margin: 0 22px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{team}}" as="m" hint-placeholder-count="4">
      <button type="button" onClick="{{m.pick}}" style="text-align: right; background: {{m.bg}}; border: {{m.border}}; border-radius: 20px; padding: 10px 14px; display: flex; flex-direction: column; gap: 9px; color: #0B1A33; font-family: Tajawal, sans-serif; box-shadow: 0 4px 18px rgba(11,42,91,0.07); cursor: pointer">
        <span style="display: flex; align-items: center; gap: 12px; width: 100%">
          <span class="av" data-i="{{m.initial}}" style="width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px {{m.ring}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: none; margin-right: 2px">{{m.initial}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px">
            <span style="font-weight: 700; font-size: 15px">{{m.name}}</span>
            <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: {{m.noteColor}}; background: {{m.tint}}; padding: 2px 8px; border-radius: 999px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"/></svg>{{m.note}}</span>
          </span>
          <span style="font-family: Tajawal, sans-serif; font-size: 16px; font-weight: 800; color: {{m.loadColor}}">{{m.load}}</span>
        </span>
        <span style="height: 8px; width: 100%; border-radius: 4px; background: #E9EEF6; display: flex; overflow: hidden">
          <span style="width: {{m.barNow}}; background: {{m.ring}}; border-radius: 0 4px 4px 0"></span>
          <span style="width: {{m.barAdd}}; background: repeating-linear-gradient(135deg, #1F6FEB 0 4px, #7FB0F7 4px 8px)"></span>
        </span>
      </button>
    </sc-for>
  </section>

  <section style="margin: 12px 22px 0; border-radius: 20px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; background: {{tipBg}}; border: {{tipBorder}}">
    <span style="width: 32px; height: 32px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 2px 8px rgba(11,42,91,0.06)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{tipColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5z"/></svg>
    </span>
    <span style="font-size: 14px; font-weight: 600; line-height: 1.4; color: {{tipText}}">{{tip}}</span>
  </section>

  <section style="margin: 12px 22px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
      <span style="display: flex; align-items: center; gap: 7px"><span style="width: 26px; height: 26px; border-radius: 8px; background: #E8F0FE; color: #1F6FEB; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg></span><span style="font-size: 19px; font-weight: 800">1</span></span>
      <span style="font-size: 11px; color: #66728A; white-space: nowrap">تأخير تفاديته</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
      <span style="display: flex; align-items: center; gap: 7px"><span style="width: 26px; height: 26px; border-radius: 8px; background: #FDECEC; color: #E5484D; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span><span style="font-size: 19px; font-weight: 800">0</span></span>
      <span style="font-size: 11px; color: #66728A; white-space: nowrap">إرهاق</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 4px 14px rgba(11,42,91,0.06)">
      <span style="display: flex; align-items: center; gap: 7px"><span style="width: 26px; height: 26px; border-radius: 8px; background: #E3F7EF; color: #16A37A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/></svg></span><span style="font-size: 19px; font-weight: 800">400</span></span>
      <span style="font-size: 11px; color: #66728A; white-space: nowrap">ريال وفّرتها</span>
    </div>
  </section>

  <div style="position: absolute; left: 22px; right: 22px; bottom: 30px; display: flex; flex-direction: column; gap: 8px">
    <a href="MainAR.dc.html" style="height: 52px; border-radius: 999px; background: linear-gradient(135deg, #1F6FEB, #2E9BF0); color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(31,111,235,0.30); gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6z"/></svg>أرسلها لـ{{chosen}}</a>
  </div>
  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 7px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #0B1A33; opacity: 0.85"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'n' };
  }
  renderVals() {
    const team = [
      { id: 'f', name: 'فيصل', initial: 'ف', now: 115, note: 'مشغول بعرض سُبل', icon: 'M12 3l9 16H3zM12 10v4', tip: 'بيوصل 135% · عرض سُبل بيتأخر' },
      { id: 'a', name: 'عبدالله', initial: 'ع', now: 95, note: 'قريب من الحد', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2', tip: 'بيوصل 115% · أرقام الربع 3 بتتأخر' },
      { id: 'n', name: 'نورة', initial: 'ن', now: 60, note: 'اختيار منتج · سوّى مثله بمايو', icon: 'M12 3l2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5z', tip: 'فاضية 12 ساعة · وفرصة تتطور' },
      { id: 'k', name: 'خالد', initial: 'خ', now: 80, note: 'عنده مهمة متأخرة', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 8v5M12 16v.01', tip: 'عنده متأخرة · خلّه هالأسبوع' }
    ];
    const add = 20;
    const p = this.state.pick;
    const sel = team.find((t) => t.id === p);
    const col = (v) => (v > 100 ? '#E5484D' : v > 85 ? '#E8900C' : '#16A37A');
    const textCol = (v) => (v > 100 ? '#E5484D' : v > 85 ? '#B86E00' : '#0F8A66');
    const good = sel.now + add <= 100;
    return {
      team: team.map((t) => {
        const total = t.now + add;
        const isSel = t.id === p;
        const scale = 140;
        return Object.assign({}, t, {
          ring: col(t.now),
          tint: t.id === 'k' ? '#FFF4E0' : t.now > 100 ? '#FDECEC' : t.now > 85 ? '#FFF4E0' : '#E3F7EF',
          noteColor: t.id === 'k' ? '#B86E00' : textCol(t.now),
          loadColor: textCol(t.now),
          load: isSel ? total + '%' : t.now + '%',
          barNow: Math.round((Math.min(t.now, scale) / scale) * 100) + '%',
          barAdd: isSel ? Math.round((add / scale) * 100) + '%' : '0%',
          bg: isSel ? '#E8F0FE' : '#FFFFFF',
          border: isSel ? '1.5px solid #1F6FEB' : '1.5px solid #FFFFFF',
          pick: () => this.setState({ pick: t.id })
        });
      }),
      tip: sel.tip,
      tipBg: good ? '#E3F7EF' : '#FDECEC',
      tipBorder: good ? '1px solid #BDEBD8' : '1px solid #F7C9CB',
      tipColor: good ? '#16A37A' : '#E5484D',
      tipText: good ? '#0B5E46' : '#9B2C2F',
      chosen: sel.name
    };
  }
}
</script>
</body>
