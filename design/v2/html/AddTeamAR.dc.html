<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { way: 'snap', off: { m6: true }, sent: false };
  }
  renderVals() {
    const P = [
      { id: 'm1', name: 'فيصل شاهين', ini: 'ف', av: 'linear-gradient(135deg, #1F6FEB, #2EC4D6)', role: 'مبيعات', phone: '05x xxx 4412' },
      { id: 'm2', name: 'عبدالله القحطاني', ini: 'ع', av: 'linear-gradient(135deg, #6D4AFF, #A78BFA)', role: 'مالية', phone: '05x xxx 9031' },
      { id: 'm3', name: 'نورة الحربي', ini: 'ن', av: 'linear-gradient(135deg, #EC4899, #F59E0B)', role: 'تصميم', phone: '05x xxx 7720' },
      { id: 'm4', name: 'خالد الدوسري', ini: 'خ', av: 'linear-gradient(135deg, #0EA5A4, #34D399)', role: 'عمليات', phone: '05x xxx 1186' },
      { id: 'm5', name: 'سعد المطيري', ini: 'س', av: 'linear-gradient(135deg, #F26A1B, #FFB547)', role: 'تطوير جوال', phone: '05x xxx 5503' },
      { id: 'm6', name: 'مها الشهري', ini: 'م', av: 'linear-gradient(135deg, #16A37A, #84CC16)', role: 'تسويق', phone: '⚠ تأكد من الرقم', warn: true }
    ];
    const st = this.state;
    const n = P.filter((p) => !st.off[p.id]).length;
    const W = [['snap', 'صوّر القائمة', 'M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7'], ['contacts', 'جهاتك', 'M16 20v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1M10 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M20 8v6M17 11h6'], ['group', 'رابط القروب', 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1']];
    return {
      isSnap: st.way === 'snap', isContacts: st.way === 'contacts', isGroup: st.way === 'group',
      notSent: !st.sent, sent: st.sent,
      cta: st.way === 'group' ? 'انسخ الرابط لقروب الواتساب' : (st.way === 'snap' ? 'ادعُ ' + n + ' أشخاص' : 'ادعُ المحددين'),
      send: () => this.setState({ sent: true }),
      ways: W.map((w) => ({
        label: w[1], icon: w[2], sel: st.way === w[0] ? 'true' : 'false',
        bg: st.way === w[0] ? 'linear-gradient(150deg, #0B2A5B, #1F6FEB 60%, #2EC4D6)' : '#FFFFFF', tile: st.way === w[0] ? 'rgba(255,255,255,0.18)' : '#E8F0FE', color: st.way === w[0] ? '#FFFFFF' : '#1F6FEB', border: st.way === w[0] ? '#1F6FEB' : '#FFFFFF',
        pick: () => this.setState({ way: w[0], sent: false })
      })),
      people: P.map((p) => {
        const on = !st.off[p.id];
        return Object.assign({}, p, {
          subColor: p.warn ? '#E8900C' : '#66728A', pressed: on ? 'true' : 'false', box: on ? '#1F6FEB' : '#C9D3E3', fill: on ? '#1F6FEB' : 'transparent', mark: on ? '✓' : '',
          toggle: () => this.setState({ off: Object.assign({}, st.off, { [p.id]: on }) })
        });
      })
    };
  }
}
</script>
