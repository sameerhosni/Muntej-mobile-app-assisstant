<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { by: 'ws', z: 'm', sel: 'c' };
  }
  renderVals() {
    const WS = { m: ['منتج AI', '#1F6FEB'], n: ['نظامي', '#16A37A'], w: ['وجود', '#6D4AFF'] };
    const PPL = { f: 'فيصل', s: 'سعد', n: 'نورة', k: 'خالد', m: 'مها', sh: 'شهد' };
    const D = {
      w: { axis: ['الأحد', 'الثلاثاء', 'الخميس'], count: 9, delta: '▲ 2 عن الأسبوع الماضي',
        pts: [['a', 'm', 50, 'عرض «سجّلها وانساها»', 'f', '15 أكتوبر', 3], ['c', 'm', 92, 'مدوّن الاجتماعات للتجريبي', 's', '18 أكتوبر', 5],
          ['b', 'n', 30, 'أول عميل باشتراك سنوي', 'm', '14 أكتوبر', 2], ['d', 'w', 10, 'خلصنا حجم السوق', 'sh', '12 أكتوبر', 4], ['e', 'n', 70, 'صلّحنا 12 خلل بالحضور', 'k', '16 أكتوبر', 3]] },
      m: { axis: ['أسبوع 1', 'أسبوع 2', 'أسبوع 3', 'أسبوع 4'], count: 47, delta: '▲ 18% عن سبتمبر',
        pts: [['a', 'm', 20, 'اجتماع تجربة SPL', 'f', '7 أكتوبر', 2], ['b', 'm', 48, 'عرض التوجه الجديد', 'f', '15 أكتوبر', 3], ['c', 'm', 90, 'مدوّن الاجتماعات للتجريبي', 's', '18 أكتوبر', 5],
          ['h', 'm', 70, 'تصميم شاشات الوكلاء', 'n', '14 أكتوبر', 4], ['d', 'n', 32, 'البصمة في 3 فروع', 'k', '10 أكتوبر', 6], ['e', 'n', 62, 'أول عميل باشتراك سنوي', 'm', '16 أكتوبر', 2],
          ['f', 'w', 8, 'صفحة هبوط جديدة', 'n', '3 أكتوبر', 3], ['g', 'w', 42, 'خلصنا حجم السوق', 'sh', '13 أكتوبر', 4]] },
      q: { axis: ['أغسطس', 'سبتمبر', 'أكتوبر'], count: 128, delta: '▲ 31% عن الربع الماضي',
        pts: [['a', 'm', 8, 'إطلاق MVP v5', 's', '12 أغسطس', 7], ['b', 'm', 40, 'تجربة مع 5 مدراء', 'f', '9 سبتمبر', 4], ['c', 'm', 72, 'اجتماع تجربة SPL', 'f', '7 أكتوبر', 2], ['d', 'm', 94, 'إطلاق مدوّن الاجتماعات', 's', '18 أكتوبر', 5],
          ['e', 'n', 18, 'اعتماد الهوية', 'n', '20 أغسطس', 3], ['f', 'n', 58, 'البصمة في 3 فروع', 'k', '10 أكتوبر', 6], ['g', 'n', 86, 'أول عميل باشتراك سنوي', 'm', '16 أكتوبر', 2],
          ['h', 'w', 30, 'انطلاق وجود', 'sh', '1 سبتمبر', 1], ['i', 'w', 78, 'خلصنا حجم السوق', 'sh', '13 أكتوبر', 4]] }
    };
    const st = this.state;
    const d = D[st.z];
    const sel = d.pts.find((p) => p[0] === st.sel) || d.pts[0];
    const mkPoint = (p) => {
      const on = p[0] === sel[0];
      const c = WS[p[1]][1];
      return { title: p[3], pos: p[2] + '%', color: c, size: on ? '22px' : '14px', fill: on ? c : '#FFFFFF', pick: () => this.setState({ sel: p[0] }) };
    };
    const byEmp = st.by === 'emp';
    const lanes = byEmp
      ? Object.keys(PPL).map((k) => {
          const pts = d.pts.filter((p) => p[4] === k);
          return { isPerson: true, isWs: false, initial: PPL[k][0], name: PPL[k], color: '#1F6FEB', n: pts.length + ' إنجاز', points: pts.map(mkPoint) };
        })
      : ['m', 'n', 'w'].map((k) => {
          const pts = d.pts.filter((p) => p[1] === k);
          return { isPerson: false, isWs: true, initial: '', name: WS[k][0], color: WS[k][1], n: pts.length + ' إنجاز', points: pts.map(mkPoint) };

        pick: () => this.setState({ z: z[0], sel: 'c' })
      })),
      selTitle: sel[3], selWho: PPL[sel[4]], selDate: sel[5], selProof: sel[6], selPts: 50 + 15 * sel[6], selWs: WS[sel[1]][0], selColor: WS[sel[1]][1]
    };
  }
}
