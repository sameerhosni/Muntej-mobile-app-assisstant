    <div style="position: relative; margin: 16px 22px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); border-radius: 16px; padding: 9px 10px; display: flex; flex-direction: column; gap: 4px">

  <sc-if value="{{showBranch}}" hint-placeholder-val="{{ true }}">
    <section style="position: relative; margin: -22px 22px 0; background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset -4px 0 0 #1F6FEB, 0 8px 24px rgba(11,42,91,0.10)">

      <span style="display: flex; align-items: center; gap: 10px">
        <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #FFF4E0; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8900C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>

          <span style="display: flex; gap: 6px">

            <span style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: #0F7A5A; background: #E3F7EF; padding: 3px 8px; border-radius: 999px; white-space: nowrap"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#16A37A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>5,000 ريال</span>
          </span>
        </span>
      </span>
      <div style="display: flex; gap: 8px">
        <button type="button" onClick="{{addBranch}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: linear-gradient(135deg, #1F6FEB, #2E9BF0); color: #FFFFFF; font-family: Tajawal, sans-serif; font-size: 13px; font-weight: 700; box-shadow: 0 6px 14px rgba(31,111,235,0.28)">ادعُ مدير جدة</button>
        <button type="button" onClick="{{hideBranch}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D6E2F5; background: #FFFFFF; color: #1F6FEB; font-family: Tajawal, sans-serif; font-size: 13px; font-weight: 700">مو الحين</button>
      </div>
    </section>
  </sc-if>
  <sc-if value="{{branchSent}}" hint-placeholder-val="{{ false }}">
    <section style="position: relative; margin: -22px 22px 0; background: #E3F7EF; border-radius: 20px; padding: 14px 16px; display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 700; line-height: 1.45; color: #0F7A5A; box-shadow: 0 8px 24px rgba(11,42,91,0.08)"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; background: #16A37A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span><span>دعينا عمر (جدة) · تجهيزه جاهز</span></section>
  </sc-if>

  <section style="position: relative; margin: 14px 22px 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
      <a href="{{a.href}}" style="background: #FFFFFF; border-radius: 18px; padding: 11px 12px; display: flex; align-items: center; gap: 12px; color: #0B1A33; box-shadow: 0 4px 18px rgba(11,42,91,0.07)">
        <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: {{a.tint}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{a.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"/></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{a.title}}</span><span style="font-size: 12px; color: #66728A">{{a.sub}}</span></span>
        <span style="font-size: 12px; font-weight: 800; color: #E2580B; background: #FFF1E8; padding: 4px 9px; border-radius: 999px; white-space: nowrap">{{a.reward}}</span>

  <section style="position: absolute; right: 22px; left: 22px; bottom: 28px; background: linear-gradient(150deg, #0B2A5B 0%, #1F6FEB 62%, #2EC4D6 120%); color: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; box-shadow: 0 12px 28px rgba(31,111,235,0.30)">

  <span aria-hidden="true" style="position: absolute; right: 50%; bottom: 7px; width: 134px; height: 5px; margin-right: -67px; border-radius: 3px; background: #0B1A33; opacity: 0.85"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { branch: 'ask', referred: false };
  }
  renderVals() {
    const st = this.state;
    return {
      stats: [{ v: st.branch === 'sent' ? '3' : '2', l: 'فرق شغّالة', bg: '#2E9BF0', icon: 'M3 21h18M5 21V8l7-4 7 4v13M9 21v-5h6v5' }, { v: '17', l: 'شخص نشط', bg: '#6D4AFF', icon: 'M17 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M10 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-1a4 4 0 0 0-3-3.9M16 4.2a3.5 3.5 0 0 1 0 6.6' }, { v: '94%', l: 'انضموا بنفسهم', bg: '#16A37A', icon: 'M5 12l5 5 9-10' }],
      showBranch: st.branch === 'ask', branchSent: st.branch === 'sent',
      addBranch: () => this.setState({ branch: 'sent' }),
      hideBranch: () => this.setState({ branch: 'hidden' }),
      actions: [
        { href: 'AddTeamAR.dc.html', icon: 'M12 5v14M5 12h14', title: 'فريق جديد', sub: 'يوفّر 25 ساعة/شهر', reward: '200+ نقطة', tint: '#E8F0FE', ink: '#1F6FEB' },
        { href: 'TeamLaunchAR.dc.html', icon: 'M16 20v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1M10 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M20 8v6M17 11h6', title: 'ادعُ مدير ثاني', sub: 'تجهيز 5 دقايق له', reward: '100+ نقطة', tint: '#EFEBFF', ink: '#6D4AFF' },
        { href: 'ReceiptAR.dc.html', icon: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6', title: 'ورّ مديرك', sub: 'الساعات والريالات الموفّرة', reward: 'الإيصال', tint: '#E3F7EF', ink: '#16A37A' }
      ],
      refLabel: st.referred ? 'انرسل واتساب ✓' : 'شارك على الواتساب',
      refBg: st.referred ? '#E3F7EF' : '#FFFFFF', refColor: st.referred ? '#0F7A5A' : '#1F6FEB',
      refer: () => this.setState({ referred: true })
    };
  }
}
</script>
