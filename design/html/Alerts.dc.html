<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Muntej Alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1426}
a{color:#2DD4BF;text-decoration:none}a:hover{color:#5EEAD4}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B1426; color: #EAF2FF; font-family: Inter, sans-serif; direction: ltr; box-sizing: border-box">

  <header style="padding: 26px 22px 0; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 24px; font-weight: 800">Alerts</span>
    <span style="font-size: 14px; color: #8FA3C4">Few and important — on the channel you prefer</span>
  </header>

  <section style="margin: 14px 22px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{channels}}" as="c" hint-placeholder-count="4">
      <button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" style="height: 68px; border-radius: 16px; border: {{c.border}}; background: #121E36; color: {{c.color}}; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0">
        <span style="font-size: 14px; font-weight: 700">{{c.name}}</span>
        <span style="font-size: 11px">{{c.state}}</span>
      </button>
    </sc-for>
  </section>

  <section style="margin: 16px 22px 0; background: #121E36; border-radius: 18px; padding: 4px 14px; display: flex; flex-direction: column">
    <sc-for list="{{rules}}" as="r" hint-placeholder-count="6">
      <div style="height: 54px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1A2846">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}; flex: none"></span>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 700">{{r.name}}</span>
          <span style="font-size: 11px; color: #8FA3C4">{{r.via}}</span>
        </span>
        <button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.pressed}}" aria-label="{{r.name}}" style="width: 48px; height: 28px; border-radius: 14px; border: none; background: {{r.track}}; padding: 3px; display: flex; justify-content: {{r.justify}}; flex: none">
          <span style="width: 22px; height: 22px; border-radius: 50%; background: #EAF2FF"></span>
        </button>
      </div>
    </sc-for>
  </section>

  <section style="margin: 12px 22px 0; background: #121E36; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5EB3E4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Quiet hours</span><span style="font-size: 12px; color: #8FA3C4">Prayer times · after 9 PM · Fri · Ramadan mode</span></span>
    <span style="font-size: 12px; color: #2DD4BF; font-weight: 700">On</span>
  </section>

  <section style="margin: 12px 22px 0; background: #2A2312; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5B547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    <span style="font-size: 13px; line-height: 1.7; color: #F2E3BF">Smart escalation: no reply in 24 hrs? Muntej nudges the employee twice, then alerts you.</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      ch: { push: true, mail: true, wa: true, tm: false },
      ru: { risk: true, late: true, approve: true, review: true, daily: true, weekly: false }
    };
  }
  renderVals() {
    const st = this.state;
    const chs = [['push', 'Push'], ['mail', 'Email'], ['wa', 'WhatsApp'], ['tm', 'Teams']];
    const rules = [
      ['risk', 'Task at risk of delay', 'Push + WhatsApp · Instant', '#FF9B93'],
      ['late', 'Task overdue', 'Push · Instant', '#FF9B93'],
      ['approve', 'Request awaiting your decision', 'Push · Instant', '#F5B547'],
      ['review', 'New submission to review', 'Push', '#F5B547'],
      ['daily', 'Daily summary', 'Email · 8:00 AM', '#2DD4BF'],
      ['weekly', 'Weekly performance report', 'Email · Thu 4 PM', '#2DD4BF']
    ];
    const sw = (on) => ({ pressed: on ? 'true' : 'false', track: on ? '#2DD4BF' : '#2A3A5C', justify: on ? 'flex-end' : 'flex-start' });
    return {
      channels: chs.map((c) => {
        const on = !!st.ch[c[0]];
        return { name: c[1], pressed: on ? 'true' : 'false', state: on ? 'On' : 'Off',
          border: on ? '1px solid #2DD4BF' : '1px dashed #2A3A5C', color: on ? '#2DD4BF' : '#8FA3C4',
          toggle: () => this.setState({ ch: Object.assign({}, st.ch, { [c[0]]: !on }) }) };
      }),
      rules: rules.map((r) => {
        const on = !!st.ru[r[0]];
        return Object.assign({ name: r[1], via: r[2], dot: r[3],
          toggle: () => this.setState({ ru: Object.assign({}, st.ru, { [r[0]]: !on }) }) }, sw(on));
      })
    };
  }
}
</script>
</body>
</html>
