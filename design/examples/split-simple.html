<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split simple</title>
<style>
  body { margin:0; padding:18px 16px 24px; background:#F3F6FB; font-family: Tahoma, "Segoe UI", sans-serif; color:#0B1B3F; width:390px; box-sizing:border-box; }
  h2 { font-size:14px; color:#5B6576; font-weight:700; margin:4px 0 8px; }
  .tag { display:inline-block; background:#0B1B3F; color:#fff; border-radius:8px; padding:2px 9px; font-size:13px; margin-left:6px; }
  .sect { font-weight:800; font-size:16px; margin:4px 2px 8px; }
  .row { display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid #E2E8F2; border-radius:14px; padding:10px 12px; }
  .go { color:#6B4FD8; font-weight:700; font-size:14px; }
  .x { color:#8A94A6; font-size:16px; padding:2px 6px; }
  .gone { font-size:12px; color:#5B6576; margin:8px 2px 0; }
  hr { border:0; border-top:2px dashed #C9D3E3; margin:18px 0 14px; }
</style>
</head>
<body>
  <h2><span class="tag">ب</span>سطر واحد بسيط، بدون بطاقة بنفسجية</h2>
  <div class="sect">الخطوات</div>
  <div class="row"><span class="go">✨ خلني أقسّمها</span><span class="x">✕</span></div>
  <div class="gone">✕ = ما أحتاجها: يختفي لهذي المهمة ولا يرجع.</div>
  <hr>
  <h2>بعد ✕</h2>
  <div class="sect">الخطوات</div>
  <div class="gone">(ما يظهر شي. تقدر تضيف خطوات بالكتابة أو الصوت مثل قبل)</div>
</body>
</html>
