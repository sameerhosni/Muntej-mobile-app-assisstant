# Android builds on GitHub's free runners instead of Expo's build servers (no monthly build limit).
# Same EAS build, run with --local: signing keys and EXPO_PUBLIC_* variables still come from the Expo project.
# Start it: Actions → "Android build" → Run workflow, or push a tag `android-preview-<anything>` / `android-production-<anything>`.
# Result: a GitHub release with the .apk (preview) or .aab (production, for Google Play), plus the workflow artifact.
# Needs one repository secret: EXPO_TOKEN (expo.dev → Account settings → Access tokens).
name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'preview = APK to install on phones, production = AAB for Google Play'
        type: choice
        options: [preview, production]
        default: preview
  push:
    tags: ['android-preview-*', 'android-production-*']

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ inputs.profile || (startsWith(github.ref_name, 'android-production-') && 'production' || 'preview') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Build
        run: |
          EXT=$([ "$PROFILE" = production ] && echo aab || echo apk)
          VERSION=$(node -p "require('./app.json').expo.version")
          OUT="muntej-${VERSION}-${PROFILE}-${GITHUB_RUN_NUMBER}.${EXT}"
          npx -y eas-cli@latest build --platform android --profile "$PROFILE" --local --non-interactive --output "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          retention-days: 30

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${VERSION}-${PROFILE}-${GITHUB_RUN_NUMBER}" "$OUT" \
            --title "Muntej ${VERSION} (${PROFILE}, build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on the phone and tap the file to install." \
            --target "$GITHUB_SHA"
